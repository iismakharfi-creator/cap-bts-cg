},
{ id:"p3", code:"P3", group:"Processus comptables", name:"Gestion des obligations fiscales", short:"Déclaration de taxe, impôt sur les sociétés",
  fiches:[
  { titre:"La déclaration de taxe sur la valeur ajoutée", freq:"Très fréquent", html:`
    <p>Chaque mois (ou chaque trimestre pour les petites entreprises), l'entreprise calcule ce qu'elle doit à l'État :</p>
    <div class="def"><b>Taxe à payer</b> = taxe collectée sur les ventes − taxe déductible sur les achats (biens et services) − taxe déductible sur les immobilisations − crédit de taxe du mois précédent.</div>
    <ul><li>Si le résultat est positif : <b>taxe à décaisser</b> (compte 44551), on paie l'État.</li>
    <li>Si le résultat est négatif : <b>crédit de taxe</b> (compte 44567), l'État nous doit, on le reporte le mois suivant.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>En mars : taxe collectée 5 000 ; taxe déductible sur achats 2 000 ; sur un ordinateur acheté 1 000. Taxe à décaisser = 5 000 − 2 000 − 1 000 = <b>2 000 euros</b>.</div>
    <div class="tbl"><table><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
    <tr><td>44571</td><td>Taxe collectée</td><td class="num">5 000</td><td></td></tr>
    <tr><td>44566</td><td>Taxe déductible sur autres biens et services</td><td></td><td class="num">2 000</td></tr>
    <tr><td>44562</td><td>Taxe déductible sur immobilisations</td><td></td><td class="num">1 000</td></tr>
    <tr><td>44551</td><td>Taxe à décaisser</td><td></td><td class="num">2 000</td></tr></table></div>
    <p>Puis au paiement : 44551 au débit, 512 Banque au crédit.</p>`},
  { titre:"Quand la taxe devient-elle due ? (exigibilité)", freq:"Fréquent", html:`
    <div class="def">L'<b>exigibilité</b>, c'est le moment où la taxe collectée doit être déclarée à l'État.</div>
    <ul><li>Pour les <b>ventes de biens</b> (marchandises) : à la <b>livraison</b>.</li>
    <li>Pour les <b>prestations de services</b> : à l'<b>encaissement</b> (quand le client paie), sauf si l'entreprise a choisi l'option « sur les débits » (à la facturation).</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Un plombier (prestation de services) facture 1 200 euros toutes taxes comprises en mars, le client paie en mai : la taxe de 200 euros sera déclarée en <b>mai</b>.<br>Un magasin de meubles livre une table en mars, payée en mai : la taxe est déclarée en <b>mars</b>.</div>
    <div class="tip"><span class="lab">Astuce</span>Pour les services, on utilise souvent le compte 44574 « Taxe collectée en attente » tant que le client n'a pas payé.</div>`},
  { titre:"L'impôt sur les sociétés : calcul", freq:"Tombe très souvent", html:`
    <p>Les sociétés (société à responsabilité limitée, société par actions simplifiée…) paient un impôt sur leur bénéfice : l'<b>impôt sur les sociétés</b>.</p>
    <p><b>Étape 1 : passer du résultat comptable au résultat fiscal.</b></p>
    <div class="def">Résultat fiscal = résultat comptable + <b>réintégrations</b> (charges que le fisc refuse : amendes et pénalités, l'impôt sur les sociétés lui-même, la part non déductible de l'amortissement d'une voiture de tourisme…) − <b>déductions</b> (produits non imposés).</div>
    <p><b>Étape 2 : appliquer les taux</b> (petites et moyennes entreprises qui remplissent les conditions) :</p>
    <ul><li><b>15 %</b> sur les 42 500 premiers euros de bénéfice ;</li><li><b>25 %</b> au-delà.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Résultat comptable 59 000 euros, dont une amende de 1 000 euros comptée en charge. Résultat fiscal = 59 000 + 1 000 = 60 000.<br>42 500 × 15 % = 6 375<br>(60 000 − 42 500) × 25 % = 17 500 × 25 % = 4 375<br><b>Impôt sur les sociétés = 10 750 euros</b></div>
    <div class="trap"><span class="lab">Piège</span>Les conditions du taux à 15 % : chiffre d'affaires inférieur à 10 millions d'euros, capital entièrement libéré et détenu à au moins 75 % par des personnes physiques. Vérifie-les dans l'énoncé.</div>`},
  { titre:"L'impôt sur les sociétés : acomptes et solde", freq:"Fréquent", html:`
    <p>L'impôt ne se paie pas en une fois : on verse <b>4 acomptes</b> pendant l'année, puis un <b>solde</b>.</p>
    <ul><li>Dates des acomptes (exercice clos le 31 décembre) : <b>15 mars, 15 juin, 15 septembre, 15 décembre</b>.</li>
    <li>Chaque acompte = un quart de l'impôt de l'année précédente (en pratique : 25 % de l'impôt calculé sur le résultat de l'exercice précédent).</li>
    <li>Pas d'acompte si l'impôt de l'année précédente était inférieur à 3 000 euros.</li>
    <li><b>Solde</b> = impôt de l'année − acomptes déjà versés, payé au plus tard le 15 mai de l'année suivante (pour une clôture au 31 décembre).</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Impôt N−1 = 12 000 → acomptes de 3 000 en mars, juin, septembre et décembre N. Impôt N = 16 000 → solde = 16 000 − 12 000 = <b>4 000 euros</b> à payer le 15 mai N+1.</div>
    <div class="tbl"><table><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
    <tr><td>695</td><td>Impôts sur les bénéfices (enregistrement de l'impôt de l'année au 31 décembre)</td><td class="num">16 000</td><td></td></tr>
    <tr><td>444</td><td>État, impôts sur les bénéfices</td><td></td><td class="num">16 000</td></tr></table></div>`},
  { titre:"L'autoliquidation : achats dans l'Union européenne", freq:"Fréquent", html:`
    <p>Quand une entreprise française achète des marchandises à une entreprise d'un autre pays de l'Union européenne, le vendeur facture <b>hors taxes</b>. C'est l'acheteur français qui calcule lui-même la taxe : on parle d'<b>autoliquidation</b>.</p>
    <p>L'acheteur enregistre la taxe <b>deux fois</b> : en taxe due (comme s'il l'avait collectée) et en taxe déductible. Les deux s'annulent : il ne paie rien de plus, mais l'opération apparaît dans sa déclaration.</p>
    <div class="ex"><span class="lab">Exemple</span>Une entreprise française achète pour 10 000 euros de marchandises à un fournisseur allemand. Taxe française à 20 % : 2 000 euros.</div>
    <div class="tbl"><table><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
    <tr><td>607</td><td>Achats de marchandises</td><td class="num">10 000</td><td></td></tr>
    <tr><td>44566</td><td>Taxe déductible sur autres biens et services</td><td class="num">2 000</td><td></td></tr>
    <tr><td>4452</td><td>Taxe due intracommunautaire</td><td></td><td class="num">2 000</td></tr>
    <tr><td>401</td><td>Fournisseurs</td><td></td><td class="num">10 000</td></tr></table></div>
    <div class="trap"><span class="lab">Piège</span>Le fournisseur est payé <b>10 000</b> euros, pas 12 000 : la facture n'a pas de taxe.</div>
    <p><b>Taxe non récupérable</b> : certaines dépenses ne permettent pas de déduire la taxe, par exemple l'achat d'une voiture de tourisme. La taxe est alors ajoutée au coût d'achat.</p>`}
  ],
  quiz:[
  {q:"Taxe collectée 8 000, taxe déductible 9 500. Résultat :",o:["Taxe à décaisser de 1 500","Crédit de taxe de 1 500","Rien à déclarer"],a:1,e:"La taxe déductible est plus grande : l'État doit 1 500 euros à l'entreprise, c'est un crédit de taxe (compte 44567)."},
  {q:"Pour une prestation de services, la taxe est exigible en principe…",o:["À la commande","À la facturation","À l'encaissement"],a:2,e:"Pour les services, la taxe est due quand le client paie (sauf option sur les débits)."},
  {q:"Résultat fiscal 30 000 euros, petite entreprise remplissant les conditions. Impôt sur les sociétés :",o:["4 500 euros","7 500 euros","6 375 euros"],a:0,e:"30 000 est sous le seuil de 42 500 : tout est taxé à 15 %. 30 000 × 15 % = 4 500."},
  {q:"Une amende pour excès de vitesse payée par l'entreprise doit être…",o:["Déduite","Réintégrée","Ignorée"],a:1,e:"Les amendes ne sont pas déductibles fiscalement : on les ajoute au résultat comptable."},
  {q:"Impôt de l'année précédente : 20 000 euros. Montant de chaque acompte :",o:["5 000 euros","20 000 euros","2 000 euros"],a:0,e:"Un quart : 20 000 ÷ 4 = 5 000 euros."},
  {q:"Le compte de la taxe déductible sur un achat de véhicule utilitaire est :",o:["44566","44562","44571"],a:1,e:"Un véhicule utilitaire est une immobilisation : compte 44562."},
  {q:"Achat de 5 000 euros hors taxes à un fournisseur espagnol. Le fournisseur est payé…",o:["6 000 euros","5 000 euros","4 000 euros"],a:1,e:"Achat intracommunautaire : la facture est hors taxes, l'acheteur autoliquide la taxe."},
  {q:"En autoliquidation, la taxe due est enregistrée au compte…",o:["44571","4452","44551"],a:1,e:"4452 Taxe due intracommunautaire, au crédit ; elle est compensée par la taxe déductible au débit."}
  ],
  cas:[
  {titre:"Société Arpège, magasin d'instruments", enonce:`<p>La société par actions simplifiée Arpège vend des instruments de musique. Taux de taxe : 20 %.</p>
   <ul><li>Ventes de mars : 40 000 euros hors taxes.</li><li>Achats de marchandises de mars : 25 000 euros hors taxes.</li><li>Achat d'un ordinateur en mars : 2 000 euros hors taxes.</li><li>Pas de crédit de taxe le mois précédent.</li></ul>
   <p>Pour l'année N : résultat comptable avant impôt 80 000 euros, dont une pénalité de retard de 1 000 euros. Arpège remplit les conditions du taux réduit. Acomptes versés en N : 12 000 euros au total.</p>`,
   qs:[
    {q:"1. Calculez la taxe à décaisser pour mars.",r:"Taxe collectée : 40 000 × 20 % = 8 000<br>Déductible sur achats : 25 000 × 20 % = 5 000<br>Déductible sur immobilisation : 2 000 × 20 % = 400<br><b>Taxe à décaisser = 8 000 − 5 000 − 400 = 2 600 euros</b>"},
    {q:"2. Enregistrez la déclaration.",r:`<div class="tbl"><table><tr><th>Compte</th><th>Débit</th><th>Crédit</th></tr><tr><td>44571 Taxe collectée</td><td class="num">8 000</td><td></td></tr><tr><td>44566 Taxe déductible biens et services</td><td></td><td class="num">5 000</td></tr><tr><td>44562 Taxe déductible immobilisations</td><td></td><td class="num">400</td></tr><tr><td>44551 Taxe à décaisser</td><td></td><td class="num">2 600</td></tr></table></div>`},
    {q:"3. Calculez le résultat fiscal et l'impôt sur les sociétés de N.",r:"Résultat fiscal = 80 000 + 1 000 (pénalité réintégrée) = 81 000<br>42 500 × 15 % = 6 375<br>(81 000 − 42 500) × 25 % = 38 500 × 25 % = 9 625<br><b>Impôt = 16 000 euros</b>"},
    {q:"4. Quel est le solde à payer et à quelle date ?",r:"Solde = 16 000 − 12 000 = <b>4 000 euros</b>, à payer au plus tard le <b>15 mai N+1</b>."}
   ]}
  ]
},
{ id:"p4", code:"P4", group:"Processus comptables", name:"Gestion des relations sociales", short:"Paie, contrat de travail",
  fiches:[
  { titre:"Le contrat de travail", freq:"Fréquent", html:`
    <div class="def">Le <b>contrat de travail</b> est un accord par lequel une personne (le salarié) travaille pour une autre (l'employeur), sous son autorité, en échange d'un salaire. Le lien d'autorité s'appelle le <b>lien de subordination</b>.</div>
    <ul><li><b>Contrat à durée indéterminée</b> : la forme normale, sans date de fin.</li>
    <li><b>Contrat à durée déterminée</b> : avec une date de fin, autorisé seulement dans des cas précis (remplacer un salarié absent, surcroît temporaire d'activité, travail saisonnier). Il doit être écrit.</li>
    <li><b>Contrat d'apprentissage et contrat de professionnalisation</b> : des contrats en alternance, comme le tien.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Une boutique embauche un vendeur en contrat à durée déterminée de décembre à janvier pour les fêtes : c'est un surcroît temporaire d'activité, c'est autorisé. Elle ne peut pas utiliser des contrats à durée déterminée à la suite pour un poste permanent.</div>
    <p><b>Période d'essai</b> : période au début du contrat pendant laquelle chacun peut rompre facilement. <b>Congés payés</b> : 2,5 jours ouvrables par mois travaillé, soit 30 jours ouvrables (5 semaines) par an.</p>`},
  { titre:"Du salaire brut au net à payer", freq:"Tombe à presque tous les examens", html:`
    <p>Un temps plein légal = <b>35 heures par semaine</b>, soit <b>151,67 heures par mois</b> (35 × 52 ÷ 12).</p>
    <div class="def"><b>Salaire brut</b> = salaire de base + heures supplémentaires + primes + avantages.<br><b>Net avant impôt</b> = brut − cotisations salariales.<br><b>Net à payer</b> = net avant impôt − prélèvement à la source de l'impôt sur le revenu.</div>
    <p><b>Heures supplémentaires</b> (au-delà de 35 heures par semaine) : majorées de <b>25 %</b> pour les 8 premières (de la 36e à la 43e heure), puis de <b>50 %</b> au-delà, sauf accord collectif différent.</p>
    <div class="ex"><span class="lab">Exemple</span>Taux horaire 12 euros. Une semaine de 45 heures = 10 heures supplémentaires.<br>8 heures × 12 × 1,25 = 120<br>2 heures × 12 × 1,50 = 36<br>Total des heures supplémentaires : <b>156 euros</b></div>
    <div class="def"><b>Cotisations salariales</b> : retenues sur le salaire du salarié (assurance vieillesse, contribution sociale généralisée…). <b>Cotisations patronales</b> : payées en plus par l'employeur, elles ne diminuent pas le salaire.</div>`},
  { titre:"Enregistrer la paie", freq:"Très fréquent", html:`
    <div class="ex"><span class="lab">Exemple (taux simplifiés pour s'entraîner)</span>Brut 2 000 ; cotisations salariales 440 ; prélèvement à la source 50 ; net à payer 2 000 − 440 − 50 = 1 510. Cotisations patronales 900.</div>
    <div class="tbl"><table><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
    <tr><td>641</td><td>Rémunérations du personnel (le brut)</td><td class="num">2 000</td><td></td></tr>
    <tr><td>431 / 437</td><td>Sécurité sociale et autres organismes sociaux (part salariale)</td><td></td><td class="num">440</td></tr>
    <tr><td>4421</td><td>Prélèvement à la source</td><td></td><td class="num">50</td></tr>
    <tr><td>421</td><td>Personnel, rémunérations dues (le net à payer)</td><td></td><td class="num">1 510</td></tr></table></div>
    <div class="tbl"><table><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
    <tr><td>645</td><td>Charges de sécurité sociale et de prévoyance (part patronale)</td><td class="num">900</td><td></td></tr>
    <tr><td>431 / 437</td><td>Organismes sociaux</td><td></td><td class="num">900</td></tr></table></div>
    <div class="tip"><span class="lab">Astuce</span>Le coût total du salarié pour l'employeur = brut + cotisations patronales = 2 900 euros, alors que le salarié touche 1 510 euros.</div>`},
  { titre:"Les congés payés : la règle la plus favorable", freq:"Fréquent", html:`
    <p>Pendant ses congés, le salarié reçoit une <b>indemnité de congés payés</b>. On la calcule de deux façons et on lui verse <b>la plus favorable</b> :</p>
    <ul><li><b>Règle du dixième</b> : 1/10 du salaire brut gagné pendant la période de référence (en général du 1er juin au 31 mai), pour les 30 jours ouvrables de congés.</li>
    <li><b>Maintien de salaire</b> : ce que le salarié aurait gagné s'il avait travaillé.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Salaire brut de la période de référence : 24 000 euros. Salaire mensuel actuel : 1 950 euros. Congés pris : 12 jours ouvrables.<br>
    Dixième : 24 000 × 1/10 = 2 400 pour 30 jours → 2 400 × 12/30 = <b>960 euros</b><br>
    Maintien (méthode courante avec 26 jours ouvrables par mois) : 1 950 ÷ 26 × 12 = <b>900 euros</b><br>
    On verse <b>960 euros</b>, le montant le plus favorable.</div>
    <p><b>Arrêt maladie</b> : la Sécurité sociale verse des indemnités journalières après un délai de carence (3 jours dans le cas général). L'employeur peut compléter selon la loi et la convention collective. Les règles changent souvent : vérifie toujours les montants en vigueur.</p>`},
  { titre:"La fin du contrat de travail : indemnités et documents", freq:"Fréquent", html:`
    <ul><li><b>Préavis</b> : période entre l'annonce de la rupture et le départ effectif (sa durée dépend de l'ancienneté et de la convention collective).</li>
    <li><b>Indemnité légale de licenciement</b> (sauf faute grave, à partir de 8 mois d'ancienneté) : 1/4 de mois de salaire par année d'ancienneté jusqu'à 10 ans, puis 1/3 de mois par année au-delà.</li>
    <li><b>Indemnité compensatrice de congés payés</b> : pour les jours de congés acquis et non pris.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Salariée licenciée après 6 ans, salaire de référence 2 000 euros. Indemnité légale = 6 × 2 000 × 1/4 = <b>3 000 euros</b>.</div>
    <p><b>Documents à remettre au départ</b> : le <b>certificat de travail</b>, l'<b>attestation destinée à France Travail</b> (pour les allocations chômage) et le <b>reçu pour solde de tout compte</b> (la liste des sommes versées).</p>`}
  ],
  quiz:[
  {q:"Nombre d'heures mensuelles pour un temps plein de 35 heures :",o:["140 heures","151,67 heures","160 heures"],a:1,e:"35 × 52 semaines ÷ 12 mois = 151,67 heures."},
  {q:"La 37e heure de la semaine est majorée de :",o:["10 %","25 %","50 %"],a:1,e:"De la 36e à la 43e heure : majoration de 25 %."},
  {q:"Le salaire brut s'enregistre au compte :",o:["421","641","645"],a:1,e:"641 Rémunérations du personnel, au débit."},
  {q:"Les cotisations patronales…",o:["Sont retirées du salaire brut","S'ajoutent au coût pour l'employeur","Sont payées par le salarié"],a:1,e:"Elles sont payées par l'employeur en plus du brut, elles ne diminuent pas le salaire."},
  {q:"Combien de jours ouvrables de congés payés pour un an de travail ?",o:["25","30","35"],a:1,e:"2,5 jours par mois × 12 = 30 jours ouvrables, soit 5 semaines."},
  {q:"Un contrat à durée déterminée peut servir à…",o:["Pourvoir un poste permanent","Remplacer un salarié en congé maternité","Tester un salarié sans période d'essai"],a:1,e:"Le remplacement d'un salarié absent fait partie des cas autorisés."},
  {q:"Pour l'indemnité de congés payés, on retient…",o:["Toujours la règle du dixième","Toujours le maintien de salaire","Le montant le plus favorable au salarié"],a:2,e:"On calcule les deux méthodes et on verse la plus favorable."},
  {q:"Indemnité légale de licenciement, 4 ans d'ancienneté, salaire de référence 2 400 euros :",o:["2 400 euros","3 200 euros","9 600 euros"],a:0,e:"4 × 2 400 × 1/4 = 2 400 euros."},
  {q:"Quel document permet au salarié de toucher ses allocations chômage ?",o:["Le certificat de travail","L'attestation destinée à France Travail","Le bulletin de paie"],a:1,e:"L'attestation est transmise à France Travail pour ouvrir les droits."}
  ],
  cas:[
  {titre:"Paie de Karim, préparateur de commandes", enonce:`<p>Karim est payé 13 euros de l'heure, 151,67 heures par mois. En avril, il a fait 6 heures supplémentaires, toutes majorées à 25 %.</p>
   <p>Pour l'exercice, on utilise des taux simplifiés : cotisations salariales 22 % du brut ; cotisations patronales 40 % du brut. Le prélèvement à la source est de 33 euros.</p>`,
   qs:[
    {q:"1. Calculez le salaire brut.",r:"Base : 151,67 × 13 = 1 971,71<br>Heures supplémentaires : 6 × 13 × 1,25 = 97,50<br><b>Brut = 2 069,21 euros</b>"},
    {q:"2. Calculez le net à payer.",r:"Cotisations salariales : 2 069,21 × 22 % = 455,23<br>Net avant impôt : 2 069,21 − 455,23 = 1 613,98<br><b>Net à payer = 1 613,98 − 33 = 1 580,98 euros</b>"},
    {q:"3. Enregistrez la paie et les cotisations patronales.",r:`Cotisations patronales : 2 069,21 × 40 % = 827,68<div class="tbl"><table><tr><th>Compte</th><th>Débit</th><th>Crédit</th></tr><tr><td>641 Rémunérations</td><td class="num">2 069,21</td><td></td></tr><tr><td>431/437 Organismes sociaux</td><td></td><td class="num">455,23</td></tr><tr><td>4421 Prélèvement à la source</td><td></td><td class="num">33,00</td></tr><tr><td>421 Rémunérations dues</td><td></td><td class="num">1 580,98</td></tr><tr><td>645 Charges sociales</td><td class="num">827,68</td><td></td></tr><tr><td>431/437 Organismes sociaux</td><td></td><td class="num">827,68</td></tr></table></div>`},
    {q:"4. Quel est le coût total de Karim pour l'employeur ce mois-ci ?",r:"2 069,21 + 827,68 = <b>2 896,89 euros</b>"}
   ]}
  ]
},
{ id:"p5", code:"P5", group:"Processus comptables", name:"Analyse et prévision de l'activité", short:"Coûts, seuil de rentabilité, budgets",
  fiches:[
  { titre:"Charges fixes et charges variables", freq:"Base du processus 5", html:`
    <div class="def"><b>Charge variable</b> : augmente quand l'activité augmente (matières premières, marchandises, commissions des vendeurs).<br><b>Charge fixe</b> : reste la même quel que soit le volume vendu, du moins à court terme (loyer, assurance, salaires des administratifs, amortissements).</div>
    <div class="ex"><span class="lab">Exemple</span>Une pizzeria : la farine et la mozzarella sont variables (plus de pizzas = plus d'ingrédients). Le loyer du local est fixe (il est le même avec 10 ou 300 pizzas par jour).</div>`},
  { titre:"Marge sur coût variable et seuil de rentabilité", freq:"Tombe très souvent", html:`
    <div class="def"><b>Marge sur coût variable</b> = chiffre d'affaires − charges variables.<br><b>Taux de marge sur coût variable</b> = marge sur coût variable ÷ chiffre d'affaires.<br><b>Résultat</b> = marge sur coût variable − charges fixes.</div>
    <div class="def"><b>Seuil de rentabilité</b> = le chiffre d'affaires minimum pour ne faire ni bénéfice ni perte.<br>Seuil = charges fixes ÷ taux de marge sur coût variable.</div>
    <div class="def"><b>Point mort</b> = la date à laquelle le seuil est atteint.<br>Point mort (en jours) = seuil ÷ chiffre d'affaires × 360.</div>
    <div class="ex"><span class="lab">Exemple</span>Chiffre d'affaires 200 000 ; charges variables 120 000 ; charges fixes 60 000.<br>Marge sur coût variable = 80 000 ; taux = 80 000 ÷ 200 000 = 40 %<br>Seuil = 60 000 ÷ 0,40 = <b>150 000 euros</b><br>Point mort = 150 000 ÷ 200 000 × 360 = 270 jours = 9 mois de 30 jours → <b>le 30 septembre</b><br>Résultat = 80 000 − 60 000 = 20 000 euros</div>
    <div class="tip"><span class="lab">Astuce</span>Vérifie toujours : au seuil, marge sur coût variable = 150 000 × 40 % = 60 000 = charges fixes. Le résultat est bien nul.</div>`},
  { titre:"Le coût de revient complet", freq:"Fréquent", html:`
    <p>On calcule le coût d'un produit étape par étape, comme on suit son trajet dans l'entreprise :</p>
    <ul><li><b>Coût d'achat</b> = prix d'achat des matières + frais d'approvisionnement (transport, réception).</li>
    <li><b>Coût de production</b> = matières consommées (au coût d'achat) + main-d'œuvre de l'atelier + charges de l'atelier.</li>
    <li><b>Coût de revient</b> = coût de production des produits vendus + coût de distribution (commerciaux, livraison).</li>
    <li><b>Résultat analytique</b> = chiffre d'affaires − coût de revient.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Une table : bois 40 euros + transport 5 → coût d'achat 45. Main-d'œuvre 30 + atelier 15 → coût de production 90. Distribution 10 → coût de revient 100. Vendue 130 → résultat <b>+30 euros</b> par table.</div>`},
  { titre:"Le budget de trésorerie", freq:"Fréquent", html:`
    <div class="def">Le <b>budget de trésorerie</b> prévoit, mois par mois, les entrées et sorties d'argent sur le compte bancaire, pour repérer à l'avance les mois où l'argent manquera.</div>
    <ul><li><b>Encaissements</b> : ventes encaissées (attention aux délais de paiement des clients, toutes taxes comprises), emprunt reçu, apport en capital.</li>
    <li><b>Décaissements</b> : achats payés (toutes taxes comprises), salaires, loyer, taxe à décaisser, remboursement d'emprunt.</li>
    <li><b>Trésorerie fin de mois</b> = trésorerie début de mois + encaissements − décaissements.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Début janvier : 5 000 euros en banque. Encaissements de janvier : 12 000. Décaissements : 18 000. Fin janvier : 5 000 + 12 000 − 18 000 = <b>−1 000 euros</b>. Il faut prévoir une solution (découvert autorisé, négocier un délai fournisseur).</div>
    <div class="trap"><span class="lab">Piège</span>Les amortissements et les dépréciations n'apparaissent <b>jamais</b> dans un budget de trésorerie : ce ne sont pas des sorties d'argent.</div>`},
  { titre:"Les écarts sur charges directes", freq:"Tombe souvent", html:`
    <p>On compare ce qui était <b>prévu</b> (le budget) et ce qui s'est <b>réellement</b> passé. La différence s'appelle un <b>écart</b>.</p>
    <div class="def">Écart global = coût réel − coût prévu (pour la production réelle)<br>Écart sur quantité = (quantité réelle − quantité prévue) × prix prévu<br>Écart sur prix = (prix réel − prix prévu) × quantité réelle<br>Écart global = écart sur quantité + écart sur prix</div>
    <div class="ex"><span class="lab">Exemple</span>Prévu : 100 kilos de farine à 5 euros = 500 euros. Réel : 110 kilos à 4,80 euros = 528 euros.<br>
    Écart global = 528 − 500 = <b>+28 défavorable</b> (on a dépensé plus)<br>
    Écart sur quantité = (110 − 100) × 5 = <b>+50 défavorable</b> (trop de farine utilisée : gaspillage ?)<br>
    Écart sur prix = (4,80 − 5) × 110 = <b>−22 favorable</b> (le fournisseur a été moins cher)<br>
    Vérification : 50 − 22 = 28.</div>
    <div class="tip"><span class="lab">Astuce</span>Pour un coût, un écart <b>positif</b> est <b>défavorable</b>. Et il faut toujours <b>analyser</b> : qui est responsable de l'écart (l'atelier pour la quantité, le service achats pour le prix) ?</div>`},
  { titre:"Les centres d'analyse et le coût de revient", freq:"Fréquent", html:`
    <p>Certaines charges concernent directement un produit (<b>charges directes</b> : la matière d'une table). D'autres concernent plusieurs produits (<b>charges indirectes</b> : l'électricité de l'atelier, le salaire du chef d'atelier).</p>
    <p>Les charges indirectes sont réparties dans des <b>centres d'analyse</b> (approvisionnement, atelier, distribution), dans un tableau de répartition. Chaque centre a une <b>unité d'œuvre</b>, qui sert à imputer son coût aux produits.</p>
    <div class="def">Coût de l'unité d'œuvre = total des charges du centre ÷ nombre d'unités d'œuvre</div>
    <div class="ex"><span class="lab">Exemple</span>Le centre « Atelier » coûte 12 000 euros dans le mois et l'unité d'œuvre est l'heure-machine. 400 heures-machine ont été utilisées → 12 000 ÷ 400 = 30 euros l'heure.<br>Une commande qui a demandé 15 heures-machine supporte donc 15 × 30 = <b>450 euros</b> de charges de l'atelier.</div>`}
  ],
  quiz:[
  {q:"Le loyer d'un entrepôt est une charge…",o:["Variable","Fixe"],a:1,e:"Il ne dépend pas du volume vendu : charge fixe."},
  {q:"Chiffre d'affaires 100 000, charges variables 70 000. Taux de marge sur coût variable :",o:["70 %","30 %","43 %"],a:1,e:"Marge = 30 000 ; 30 000 ÷ 100 000 = 30 %."},
  {q:"Charges fixes 45 000, taux de marge sur coût variable 30 %. Seuil de rentabilité :",o:["150 000","13 500","58 500"],a:0,e:"45 000 ÷ 0,30 = 150 000 euros."},
  {q:"Seuil 120 000, chiffre d'affaires annuel 240 000 (régulier). Le point mort est atteint…",o:["Fin mars","Fin juin","Fin septembre"],a:1,e:"120 000 ÷ 240 000 × 360 = 180 jours = 6 mois → 30 juin."},
  {q:"Quel élément n'apparaît pas dans un budget de trésorerie ?",o:["Les salaires","La dotation aux amortissements","Le remboursement d'emprunt"],a:1,e:"Un amortissement est une charge calculée, sans sortie d'argent."},
  {q:"Coût de production des produits vendus 80, coût de distribution 12, prix de vente 100. Résultat unitaire :",o:["+20","+8","−12"],a:1,e:"Coût de revient = 92 ; 100 − 92 = 8 euros."},
  {q:"Prévu 200 heures à 20 euros, réel 210 heures à 19 euros. Écart sur quantité :",o:["+200 défavorable","−210 favorable","+10 défavorable"],a:0,e:"(210 − 200) × 20 = +200 : on a utilisé plus d'heures que prévu."},
  {q:"Même exemple : écart sur prix :",o:["+210 défavorable","−210 favorable","−200 favorable"],a:1,e:"(19 − 20) × 210 = −210 : l'heure a coûté moins cher que prévu."}
  ],
  cas:[
  {titre:"Entreprise Solaris, lampes solaires", enonce:`<p>Solaris vend 5 000 lampes par an à 60 euros l'unité. Le coût variable est de 36 euros par lampe. Les charges fixes s'élèvent à 96 000 euros par an. Les ventes sont régulières sur l'année.</p>`,
   qs:[
    {q:"1. Calculez le chiffre d'affaires, la marge sur coût variable et son taux.",r:"Chiffre d'affaires = 5 000 × 60 = 300 000<br>Charges variables = 5 000 × 36 = 180 000<br>Marge sur coût variable = <b>120 000</b> ; taux = 120 000 ÷ 300 000 = <b>40 %</b>"},
    {q:"2. Calculez le résultat.",r:"120 000 − 96 000 = <b>24 000 euros</b> de bénéfice."},
    {q:"3. Calculez le seuil de rentabilité en euros et en nombre de lampes.",r:"Seuil = 96 000 ÷ 0,40 = <b>240 000 euros</b><br>En quantité : 240 000 ÷ 60 = <b>4 000 lampes</b>"},
    {q:"4. À quelle date le point mort est-il atteint ?",r:"240 000 ÷ 300 000 × 360 = 288 jours = 9 mois (270 jours) + 18 jours → <b>le 18 octobre</b>."}
   ]},
  {titre:"Écarts : biscuiterie Bonnefoy", enonce:`<p>Pour fabriquer 1 000 paquets de biscuits, la biscuiterie Bonnefoy avait prévu 400 kilos de beurre à 8 euros le kilo. En réalité, pour ces 1 000 paquets, elle a utilisé 380 kilos de beurre payés 9 euros le kilo.</p>`,
   qs:[
    {q:"1. Calculez le coût prévu, le coût réel et l'écart global.",r:"Prévu : 400 × 8 = 3 200. Réel : 380 × 9 = 3 420.<br><b>Écart global = +220, défavorable.</b>"},
    {q:"2. Décomposez l'écart.",r:"Sur quantité : (380 − 400) × 8 = <b>−160, favorable</b>.<br>Sur prix : (9 − 8) × 380 = <b>+380, défavorable</b>.<br>Vérification : −160 + 380 = 220."},
    {q:"3. Commentez.",r:"L'atelier a bien travaillé : il a consommé moins de beurre que prévu. Le problème vient du <b>prix</b> du beurre, plus cher d'un euro par kilo. Le service achats doit expliquer cette hausse (hausse du marché ? changement de fournisseur ?) et chercher des solutions (contrat à prix fixe, autre fournisseur)."}
   ]}
  ]
},
{ id:"p7", code:"P7", group:"Processus comptables", name:"Fiabilisation de l'information et système d'information comptable", short:"Veille, processus, base de données",
  fiches:[
  { titre:"La veille informationnelle", freq:"Fréquent, et utile pour ton dossier", html:`
    <div class="def">La <b>veille informationnelle</b> consiste à surveiller de façon organisée et régulière les informations d'un domaine (réglementation, concurrents, technologies) pour ne rien rater d'important.</div>
    <p>Les étapes : <b>définir le besoin</b> (quoi surveiller), <b>choisir les sources</b>, <b>collecter</b>, <b>trier et vérifier</b>, <b>diffuser</b> à ceux qui en ont besoin.</p>
    <p><b>Outils</b> : alertes par courriel (Google Alertes), flux de syndication (flux RSS) lus avec un agrégateur comme Feedly, abonnements à des lettres d'information, réseaux sociaux professionnels.</p>
    <p><b>Vérifier une source</b> : qui est l'auteur ? quelle est la date ? le site est-il officiel (service-public.fr, impots.gouv.fr, urssaf.fr) ? l'information est-elle confirmée ailleurs ?</p>
    <div class="ex"><span class="lab">Exemple</span>Un cabinet comptable surveille les changements de taux de cotisations sociales : il crée une alerte « taux cotisations 2027 », s'abonne à la lettre d'information de l'Urssaf et fait une note mensuelle à l'équipe.</div>`},
  { titre:"Les processus et le diagramme événement-résultat", freq:"Fréquent", html:`
    <div class="def">Un <b>processus</b> est une suite d'activités qui, à partir d'un événement de départ, produit un résultat utile (exemple : de la commande du client jusqu'à l'encaissement).</div>
    <p>Le <b>diagramme événement-résultat</b> représente un processus :</p>
    <ul><li><b>Événement</b> : ce qui déclenche (la réception d'une commande).</li>
    <li><b>Activité</b> (ou opération) : ce qu'on fait, avec <b>qui</b> la fait (l'acteur).</li>
    <li><b>Règle d'émission</b> : la condition qui décide du résultat (« si le stock est suffisant… sinon… »).</li>
    <li><b>Résultat</b> : ce que produit l'activité (un bon de livraison, une facture), qui peut devenir l'événement de l'activité suivante.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Événement : « Demande d'inscription reçue » → Activité : « Vérifier le dossier » (acteur : secrétariat) → Règle : dossier complet ? → Résultat si oui : « Inscription validée » ; si non : « Courriel de relance envoyé ».</div>
    <div class="tip"><span class="lab">Astuce</span>Chaque activité doit avoir au moins un événement en entrée et au moins un résultat en sortie. Un résultat est rédigé avec un participe passé (« facture émise »).</div>`},
  { titre:"Les bases de données relationnelles", freq:"Très fréquent", html:`
    <div class="def">Une <b>base de données relationnelle</b> range l'information dans des <b>tables</b> (comme des tableaux). Chaque ligne est un enregistrement, chaque colonne un champ.</div>
    <ul><li><b>Clé primaire</b> : le champ qui identifie chaque ligne de façon unique (numéro de client). On la souligne dans le schéma.</li>
    <li><b>Clé étrangère</b> : un champ d'une table qui reprend la clé primaire d'une autre table, pour les relier. On la note avec un dièse (#).</li></ul>
    <div class="ex"><span class="lab">Exemple de schéma</span>CLIENT (<u>numClient</u>, nom, ville)<br>FACTURE (<u>numFacture</u>, dateFacture, montant, #numClient)<br>Le champ #numClient dans FACTURE permet de savoir à quel client appartient chaque facture.</div>`},
  { titre:"Les requêtes en langage SQL", freq:"Très fréquent", html:`
    <p>Le langage <b>SQL</b> (de l'anglais Structured Query Language, langage de requête structuré) sert à interroger une base de données.</p>
    <div class="tbl"><table><tr><th>Mot clé</th><th>Rôle</th></tr>
    <tr><td><code>SELECT</code></td><td>Les colonnes à afficher</td></tr>
    <tr><td><code>FROM</code></td><td>Les tables utilisées</td></tr>
    <tr><td><code>WHERE</code></td><td>Les conditions (et les jointures entre tables)</td></tr>
    <tr><td><code>ORDER BY</code></td><td>Le tri (ASC croissant, DESC décroissant)</td></tr>
    <tr><td><code>COUNT, SUM, AVG</code></td><td>Compter, additionner, faire la moyenne</td></tr>
    <tr><td><code>GROUP BY</code></td><td>Regrouper pour calculer par catégorie</td></tr></table></div>
    <div class="ex"><span class="lab">Exemple</span>Liste des clients de Lyon, par ordre alphabétique :<br><code>SELECT nom FROM CLIENT WHERE ville = 'Lyon' ORDER BY nom ASC;</code><br><br>Total facturé par client (jointure) :<br><code>SELECT CLIENT.nom, SUM(montant) FROM CLIENT, FACTURE WHERE CLIENT.numClient = FACTURE.numClient GROUP BY CLIENT.nom;</code></div>
    <div class="trap"><span class="lab">Piège</span>Dès qu'une requête utilise deux tables, il faut écrire la <b>jointure</b> dans le WHERE (clé primaire = clé étrangère), sinon le résultat est faux.</div>`},
  { titre:"Sécurité et protection des données personnelles", freq:"Fréquent", html:`
    <div class="def">Le <b>règlement général sur la protection des données</b> (texte européen de 2018) encadre l'utilisation des données personnelles (nom, adresse, numéro de téléphone…).</div>
    <ul><li>Ne collecter que les données <b>nécessaires</b>.</li><li>Informer les personnes et respecter leurs droits : accès, rectification, effacement.</li><li>Limiter la <b>durée de conservation</b>.</li><li>Protéger les données : mots de passe solides, sauvegardes régulières, accès réservés.</li></ul>
    <p>Le <b>progiciel de gestion intégré</b> (comme EBP ou Sage) regroupe dans un seul logiciel la comptabilité, la paie, les ventes, avec une base de données unique : une information saisie une fois est disponible partout.</p>
    <div class="ex"><span class="lab">Exemple</span>Un centre social qui garde les fiches d'inscription des familles doit les ranger dans un fichier protégé, n'y donner accès qu'au personnel concerné, et supprimer les fiches des familles parties depuis longtemps.</div>`}
  ],
  quiz:[
  {q:"Le champ qui identifie chaque ligne d'une table de façon unique s'appelle…",o:["La clé étrangère","La clé primaire","L'index"],a:1,e:"La clé primaire, soulignée dans le schéma relationnel."},
  {q:"Dans une requête SQL, quel mot clé filtre les lignes ?",o:["SELECT","WHERE","ORDER BY"],a:1,e:"WHERE contient les conditions (et les jointures)."},
  {q:"Quel outil permet de recevoir automatiquement les nouveaux articles d'un site ?",o:["Un flux de syndication (flux RSS)","Un tableur","Un progiciel de gestion intégré"],a:0,e:"Le flux RSS, lu avec un agrégateur, signale chaque nouvelle publication."},
  {q:"Dans un diagramme événement-résultat, « Si stock suffisant » est…",o:["Un événement","Une règle d'émission","Un acteur"],a:1,e:"C'est la condition qui détermine quel résultat est produit."},
  {q:"Que fait la requête : SELECT COUNT(*) FROM CLIENT WHERE ville = 'Paris'; ?",o:["Elle affiche la liste des clients parisiens","Elle compte les clients parisiens","Elle supprime les clients parisiens"],a:1,e:"COUNT(*) compte les lignes qui respectent la condition."},
  {q:"Le règlement général sur la protection des données impose notamment…",o:["De garder les données le plus longtemps possible","De limiter la durée de conservation","De collecter un maximum de données"],a:1,e:"Les données ne doivent être conservées que le temps nécessaire."}
  ],

{ id:"maths", code:"Maths", group:"Matières générales", name:"Mathématiques appliquées", short:"Pourcentages, suites, statistiques",
  fiches:[
  { titre:"Pourcentages et coefficient multiplicateur", freq:"Partout, y compris en comptabilité", html:`
    <div class="def">Augmenter de t % revient à multiplier par <b>(1 + t/100)</b>. Baisser de t % revient à multiplier par <b>(1 − t/100)</b>. Ce nombre s'appelle le <b>coefficient multiplicateur</b>.</div>
    <div class="ex"><span class="lab">Exemple</span>+8 % → × 1,08. −15 % → × 0,85.<br>Un prix de 50 euros augmenté de 8 % : 50 × 1,08 = 54 euros.</div>
    <p><b>Taux d'évolution</b> entre une valeur de départ et une valeur d'arrivée :</p>
    <div class="def">Taux = (arrivée − départ) ÷ départ × 100</div>
    <div class="ex"><span class="lab">Exemple</span>Chiffre d'affaires passé de 80 000 à 92 000 : (92 000 − 80 000) ÷ 80 000 × 100 = <b>+15 %</b>.</div>
    <div class="def"><b>Évolutions successives</b> : on <b>multiplie</b> les coefficients, on n'additionne pas les pourcentages.</div>
    <div class="ex"><span class="lab">Exemple</span>+20 % puis −20 % : 1,20 × 0,80 = 0,96 → <b>−4 %</b> au total, et non 0 %.</div>
    <div class="tip"><span class="lab">Taux réciproque</span>Pour annuler une hausse de 25 %, il faut une baisse de : 1 ÷ 1,25 = 0,80 → <b>−20 %</b>.</div>`},
  { titre:"Suites et intérêts", freq:"Très fréquent", html:`
    <div class="def"><b>Suite arithmétique</b> : on ajoute toujours le même nombre r (la raison). u<sub>n</sub> = u<sub>0</sub> + n × r.</div>
    <div class="def"><b>Suite géométrique</b> : on multiplie toujours par le même nombre q (la raison). u<sub>n</sub> = u<sub>0</sub> × q<sup>n</sup>.</div>
    <p>En finance :</p>
    <ul><li><b>Intérêts simples</b> (suite arithmétique) : les intérêts sont calculés chaque année sur le capital de départ seulement. Valeur acquise = C × (1 + t × n).</li>
    <li><b>Intérêts composés</b> (suite géométrique) : les intérêts s'ajoutent au capital et produisent eux-mêmes des intérêts. Valeur acquise = C × (1 + t)<sup>n</sup>.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>1 000 euros placés à 3 % pendant 5 ans.<br>Intérêts simples : 1 000 × (1 + 0,03 × 5) = <b>1 150 euros</b><br>Intérêts composés : 1 000 × 1,03<sup>5</sup> = <b>1 159,27 euros</b></div>`},
  { titre:"Statistiques à deux variables", freq:"Fréquent", html:`
    <p>On étudie le lien entre deux séries (par exemple les dépenses de publicité x et le chiffre d'affaires y) pour faire des <b>prévisions</b>.</p>
    <ul><li>On place les points dans un repère : le <b>nuage de points</b>.</li>
    <li>Si les points sont à peu près alignés, on cherche une droite d'équation <b>y = ax + b</b> avec la calculatrice (méthode des moindres carrés).</li>
    <li>Le <b>coefficient de corrélation</b> r est compris entre −1 et 1. Plus il est proche de 1 ou de −1, plus l'ajustement est fiable.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>La calculatrice donne y = 2,5x + 40 (en milliers d'euros), avec r = 0,98. Si l'entreprise dépense 12 000 euros de publicité (x = 12), le chiffre d'affaires prévu est 2,5 × 12 + 40 = <b>70 milliers d'euros</b>, soit 70 000 euros.</div>
    <div class="tip"><span class="lab">Astuce</span>Entraîne-toi à faire les calculs de régression sur <b>ta</b> calculatrice (menu statistiques), les touches changent selon le modèle.</div>`},
  { titre:"Probabilités et loi binomiale", freq:"Fréquent", html:`
    <div class="def">Une <b>probabilité</b> est un nombre entre 0 (impossible) et 1 (certain). P(A) = nombre de cas favorables ÷ nombre de cas possibles (quand tous les cas ont la même chance).</div>
    <div class="def"><b>Loi binomiale</b> : on répète n fois la même épreuve, de façon indépendante, avec deux issues (succès de probabilité p, échec de probabilité 1 − p). X compte le nombre de succès.<br>P(X = k) = (nombre de combinaisons de k parmi n) × p<sup>k</sup> × (1 − p)<sup>n−k</sup><br>Espérance (moyenne attendue) = n × p.</div>
    <div class="ex"><span class="lab">Exemple</span>20 % des factures contiennent une erreur. On contrôle 3 factures. Probabilité qu'une seule ait une erreur :<br>3 × 0,2 × 0,8² = 3 × 0,2 × 0,64 = <b>0,384</b><br>En moyenne, sur 3 factures : 3 × 0,2 = 0,6 facture avec une erreur.</div>`}
  ],
  quiz:[
  {q:"Une hausse de 12 % correspond au coefficient multiplicateur :",o:["0,12","1,12","0,88"],a:1,e:"1 + 12/100 = 1,12."},
  {q:"Un prix baisse de 10 % puis de 10 %. Baisse totale :",o:["20 %","19 %","21 %"],a:1,e:"0,9 × 0,9 = 0,81 → −19 %."},
  {q:"Les ventes passent de 40 000 à 50 000. Taux d'évolution :",o:["+20 %","+25 %","+10 %"],a:1,e:"(50 000 − 40 000) ÷ 40 000 = 0,25 → +25 %."},
  {q:"2 000 euros à intérêts composés à 2 % pendant 4 ans. Valeur acquise (arrondie) :",o:["2 160 euros","2 164,86 euros","2 080 euros"],a:1,e:"2 000 × 1,02⁴ = 2 000 × 1,08243… ≈ 2 164,86. (2 160 correspondrait aux intérêts simples.)"},
  {q:"Coefficient de corrélation de −0,97. L'ajustement affine est…",o:["Mauvais","Très bon","Impossible"],a:1,e:"Proche de −1 : les points sont presque alignés sur une droite qui descend."},
  {q:"Loi binomiale avec n = 50 et p = 0,1. Espérance :",o:["5","0,1","50"],a:0,e:"n × p = 50 × 0,1 = 5."}
  ],
  cas:[
  {titre:"Évolution du chiffre d'affaires de la société Kalia", enonce:`<p>Le chiffre d'affaires de la société Kalia était de 150 000 euros en 2024. Il a augmenté de 8 % en 2025, puis baissé de 5 % en 2026. Par ailleurs, la société place 10 000 euros de trésorerie à 3 % par an, à intérêts composés.</p>`,
   qs:[

    {q:"3. Quel taux de baisse ramènerait le chiffre d'affaires de 2026 à son niveau de 2024 ?",r:"Il faut que 153 900 × coefficient = 150 000 → coefficient = 150 000 ÷ 153 900 ≈ 0,9747 → une baisse d'environ <b>2,53 %</b>."},
    {q:"4. Quelle sera la valeur du placement au bout de 3 ans ?",r:"10 000 × 1,03³ = 10 000 × 1,092727 = <b>10 927,27 euros</b>"}
   ]}
  ]
},
{ id:"cg", code:"Culture", group:"Matières générales", name:"Culture générale et expression", short:"Thème 2027 : « Le vrai du faux »",
  fiches:[
  { titre:"L'épreuve de la session 2027", freq:"À connaître avant tout", html:`
    <p>L'épreuve écrite dure <b>3 heures</b>. Elle porte sur un seul thème, fixé par le ministère pour la session 2027 : <b>« Le vrai du faux »</b>.</p>
    <div class="tbl"><table><tr><th>Partie</th><th>Ce qu'on te donne</th><th>Ce que tu fais</th><th>Points</th></tr>
    <tr><td>1. Questions sur le corpus</td><td>2 ou 3 documents de types différents (texte littéraire, article, image, tableau de chiffres), datés et présentés</td><td>Tu réponds à 2 à 4 questions qui demandent de <b>comparer</b> et d'<b>interpréter</b> les documents</td><td class="num">10</td></tr>
    <tr><td>2. Essai</td><td>Deux sujets au choix, liés au thème</td><td>Tu rédiges une réponse <b>argumentée et nuancée</b>, avec le corpus, tes lectures et tes connaissances</td><td class="num">10</td></tr></table></div>
    <div class="trap"><span class="lab">Attention</span>Les anciennes annales (synthèse de documents, écriture personnelle, 4 heures) ne correspondent plus au format. Tu peux t'en servir pour les idées, pas pour la méthode.</div>
    <div class="tip"><span class="lab">Gestion du temps conseillée</span>15 minutes de lecture du corpus, 1 heure 15 pour les questions, 1 heure 15 pour l'essai, 15 minutes de relecture.</div>`},
  { titre:"Comprendre le thème « Le vrai du faux »", freq:"Le cœur de l'épreuve", html:`
    <p>Le thème ne demande pas seulement « comment reconnaître le faux ». Il pose une question plus fine : <b>le vrai et le faux sont-ils toujours opposés ?</b> Le faux peut tromper, mais il peut aussi, parfois, faire comprendre une vérité.</p>
    <p><b>Trois grands axes à retenir :</b></p>
    <ul><li><b>Le faux qui trompe</b> : mensonge, manipulation, propagande, rumeur, fausses informations, images truquées par l'intelligence artificielle.</li>
    <li><b>Le faux qui révèle</b> : la fiction (roman, film, théâtre) invente des histoires « fausses » qui disent pourtant des choses vraies sur les êtres humains et la société.</li>
    <li><b>Démêler le vrai du faux</b> : l'esprit critique, la vérification des sources, l'éducation aux médias, le rôle du journalisme et de la science.</li></ul>
    <div class="ex"><span class="lab">Exemple pour l'axe 2</span>Dans l'Antiquité, on raconte que le peintre Zeuxis avait peint des raisins si ressemblants que des oiseaux venaient les picorer. Le tableau est « faux » (ce ne sont pas de vrais raisins) mais il prouve le talent de l'artiste. Louis Aragon a résumé cette idée par une formule devenue célèbre : le <b>« mentir-vrai »</b> de l'écrivain.</div>
    <div class="ex"><span class="lab">Exemple pour l'axe 1</span>En 2023, une image du pape François en grande doudoune blanche a fait le tour des réseaux sociaux. Elle avait été fabriquée par une intelligence artificielle, et des millions de personnes l'ont crue vraie.</div>`},
  { titre:"Le vocabulaire du thème", freq:"Utile dans chaque copie", html:`
    <div class="tbl"><table><tr><th>Mot</th><th>Définition simple</th></tr>
    <tr><td>Mensonge</td><td>Dire volontairement quelque chose de faux pour tromper.</td></tr>
    <tr><td>Erreur</td><td>Dire quelque chose de faux <b>sans le savoir</b>. Ce n'est pas un mensonge.</td></tr>
    <tr><td>Illusion</td><td>Une perception trompeuse : on croit voir ou comprendre ce qui n'est pas.</td></tr>
    <tr><td>Fiction</td><td>Une histoire inventée, présentée comme telle. Le lecteur sait que c'est inventé : il n'est pas trompé.</td></tr>
    <tr><td>Désinformation</td><td>Diffuser volontairement une fausse information pour manipuler.</td></tr>
    <tr><td>Mésinformation</td><td>Partager une fausse information en la croyant vraie.</td></tr>
    <tr><td>Infox</td><td>Mot français pour « fake news » : une fausse information.</td></tr>
    <tr><td>Hypertrucage</td><td>Mot français pour « deepfake » : vidéo ou voix truquée par intelligence artificielle.</td></tr>
    <tr><td>Post-vérité</td><td>Situation où les émotions et les croyances comptent plus que les faits pour convaincre.</td></tr>
    <tr><td>Esprit critique</td><td>L'habitude de vérifier avant de croire : qui parle, d'où vient l'information, est-elle confirmée ?</td></tr></table></div>
    <div class="tip"><span class="lab">Astuce</span>Distinguer <b>mensonge</b> et <b>erreur</b>, ou <b>désinformation</b> et <b>mésinformation</b>, montre au correcteur que tu nuances. C'est exactement ce qu'il attend.</div>`},
  { titre:"Œuvres de référence à connaître", freq:"Pour nourrir l'essai", html:`
    <p>Tu n'as pas besoin de tout lire. Choisis 4 ou 5 œuvres, et pour chacune, retiens le résumé et l'idée qu'elle illustre.</p>
    <div class="tbl"><table><tr><th>Œuvre</th><th>De quoi ça parle</th><th>Idée à en tirer</th></tr>
    <tr><td><i>The Truman Show</i>, film de Peter Weir (1998)</td><td>Un homme découvre que toute sa vie est une émission de télévision filmée à son insu.</td><td>On peut vivre dans un monde faux sans le savoir ; les médias peuvent fabriquer une réalité.</td></tr>
    <tr><td><i>Arrête-moi si tu peux</i>, film de Steven Spielberg (2002)</td><td>Un jeune faussaire se fait passer pour pilote, médecin, avocat, et fabrique de faux chèques.</td><td>Le faux séduit ; l'apparence et l'assurance suffisent souvent à faire croire.</td></tr>
    <tr><td><i>Illusions perdues</i>, roman d'Honoré de Balzac (1837-1843)</td><td>Un jeune poète monte à Paris et devient journaliste dans une presse qui fait et défait les réputations pour de l'argent.</td><td>L'information peut être achetée et manipulée.</td></tr>
    <tr><td><i>La Servante écarlate</i>, roman de Margaret Atwood (1985)</td><td>Dans une dictature religieuse, le pouvoir contrôle les mots, les livres et la mémoire.</td><td>Contrôler la vérité, c'est contrôler les gens.</td></tr>
    <tr><td><i>La Rumeur d'Orléans</i>, enquête d'Edgar Morin (1969)</td><td>Une fausse rumeur d'enlèvements de jeunes femmes dans des boutiques se répand dans une ville.</td><td>Une rumeur se propage par la peur, sans aucune preuve.</td></tr>
    <tr><td><i>L'Adversaire</i>, récit d'Emmanuel Carrère (2000)</td><td>L'histoire vraie d'un homme qui a fait croire à tous pendant dix-huit ans qu'il était médecin.</td><td>Un mensonge peut devenir une vie entière, jusqu'au drame.</td></tr>
    <tr><td><i>Les Indes fourbes</i>, bande dessinée d'Alain Ayroles et Juanjo Guarnido (2019)</td><td>Un vagabond rusé raconte sa propre histoire… en mentant au lecteur.</td><td>Le récit lui-même peut tromper ; il faut lire avec méfiance.</td></tr></table></div>`},
  { titre:"Méthode : les questions sur le corpus", freq:"Première partie, 10 points", html:`
    <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
    <li><b>Lire le paratexte</b> : auteur, date, nature du document (roman, article, affiche). La date compte : un texte de 1840 et un article de 2025 ne parlent pas du faux de la même façon.</li>
    <li><b>Lire les questions avant les documents</b>, pour savoir quoi chercher.</li>
    <li><b>Répondre en rédigeant</b> : une phrase de réponse directe, puis la justification avec des éléments précis des documents (une courte citation entre guillemets ou une référence à une ligne), puis une phrase d'interprétation.</li>
    <li><b>Comparer</b> quand la question le demande : « Les deux documents s'accordent sur… En revanche, le document 2… »</li></ol>
    <div class="ex"><span class="lab">Exemple de réponse</span>Question : « Comment le document 1 montre-t-il que le faux peut séduire ? »<br>Réponse : « Le document 1 montre que le faux séduit parce qu'il paraît plus beau que le réel. Ainsi, le narrateur décrit l'escroc comme “élégant” et “rassurant” (ligne 4) : son apparence soignée suffit à gagner la confiance de ses victimes. Le texte suggère donc que nous croyons plus volontiers ce qui nous plaît que ce qui est vrai. »</div>
    <div class="trap"><span class="lab">Erreurs fréquentes</span>Répondre par des listes ou des phrases sans verbe. Paraphraser le document sans l'analyser. Oublier de répondre à une partie de la question.</div>`},
  { titre:"Méthode : l'essai", freq:"Deuxième partie, 10 points", html:`
    <ul><li><b>Introduction</b> : une accroche (un fait d'actualité, une œuvre), la question du sujet reformulée, l'annonce du plan.</li>
    <li><b>Développement en 2 ou 3 parties</b>. Plan simple et efficace : 1) oui, le faux trompe et menace… 2) mais il peut aussi révéler une vérité… 3) l'enjeu est donc d'apprendre à les distinguer.</li>
    <li>Chaque paragraphe = <b>un argument + une explication + un exemple précis</b> (un document du corpus, une œuvre, un fait d'actualité, ton expérience professionnelle).</li>
    <li><b>Conclusion</b> : ta réponse nette à la question, éventuellement une ouverture.</li></ul>

    <div class="tip"><span class="lab">Connecteurs pour nuancer</span>certes… mais ; cependant ; en revanche ; c'est pourquoi ; en définitive. L'épreuve évalue la <b>nuance</b> : évite les réponses en « tout blanc ou tout noir ».</div>`}

  { titre:"Décrire des chiffres et des évolutions", freq:"Très fréquent", html:`

  { titre:"Le courriel professionnel", freq:"Fréquent", html:`

  { titre:"Faux amis et temps à ne pas confondre", freq:"Fréquent", html:`

    <tr><td>actually</td><td>en fait</td><td>actuellement = currently</td></tr>

    <tr><td>to control</td><td>diriger, maîtriser</td><td>contrôler = to check</td></tr></table></div>
    <p><b>Prétérit ou present perfect ?</b></p>

{ id:"ex-cejm", titre:"Les Ateliers Kerlan, vélos électriques", epreuve:"Culture économique, juridique et managériale", duree:90,
  intro:`<p class="eyebrow">Format réduit pour l'entraînement : 1 h 30, noté sur 20. L'épreuve réelle dure 4 heures et s'appuie sur un dossier documentaire plus long.</p>`,
  annexes:`<h3>Situation</h3>
  <p>Les Ateliers Kerlan est une société par actions simplifiée créée en 2018 par Maëlle Kerlan à Lorient. Elle emploie 35 salariés et fabrique des vélos électriques haut de gamme, vendus en moyenne 3 900 euros. Sa finalité est de développer des déplacements plus propres tout en restant rentable.</p>
  <p><b>Atouts et limites</b> : la qualité de ses vélos est reconnue et ses ouvriers ont un vrai savoir-faire. Mais ses prix sont élevés, sa capacité de production est limitée et elle dépend d'un seul fournisseur de batteries.</p>
  <p><b>Environnement</b> : le marché du vélo électrique progresse, porté par les aides publiques à l'achat et le prix des carburants. Mais des marques à bas prix arrivent dans les grandes surfaces de sport, et le prix des composants augmente.</p>
  <p><b>Décision</b> : pour se développer, Maëlle Kerlan propose trois projets à ses chefs d'atelier. Après un vote, elle applique le choix de la majorité : lancer une gamme de vélos cargos pour les familles et les artisans.</p>
  <p><b>Litige 1</b> : le contrat signé avec le fournisseur Voltan prévoyait la livraison de 500 batteries le 1er mars. Le 15 avril, rien n'est arrivé et Voltan ne donne aucune explication. La production est à l'arrêt.</p>
  <p><b>Litige 2</b> : un client, M. Diallo, a chuté et s'est blessé au poignet à cause d'un frein défectueux monté sur son vélo Kerlan.</p>`,
  qs:[
   {q:"1. Identifiez la finalité des Ateliers Kerlan et le type d'organisation.",pts:2,r:"Entreprise privée à finalité <b>lucrative</b> (elle cherche à être rentable), avec aussi une dimension environnementale affichée (développer des déplacements plus propres)."},
   {q:"2. Réalisez le diagnostic stratégique de l'entreprise (forces, faiblesses, opportunités, menaces).",pts:4,r:"<b>Forces</b> : qualité reconnue, savoir-faire.<br><b>Faiblesses</b> : prix élevés, capacité de production limitée, dépendance à un seul fournisseur.<br><b>Opportunités</b> : marché en croissance, aides publiques, prix des carburants.<br><b>Menaces</b> : concurrents à bas prix, hausse du prix des composants.<br>Barème : 1 point par catégorie bien classée et justifiée."},
   {q:"3. Le développement du marché du vélo électrique relève-t-il de l'économie ou du management ? Expliquez.",pts:2,r:"De l'<b>économie</b> : c'est l'évolution d'un marché (offre, demande, prix), qui concerne tous les fabricants et pas seulement Kerlan. La décision de Kerlan d'y répondre, elle, relève du management."},
   {q:"4. Caractérisez la décision de lancer les vélos cargos et le style de direction de Maëlle Kerlan.",pts:3,r:"Décision <b>stratégique</b> (classement d'Ansoff) : elle engage l'avenir à long terme et modifie l'offre de l'entreprise.<br>Style <b>participatif</b> (Likert) : la décision est prise par un vote des chefs d'atelier, et la dirigeante applique le choix de la majorité."},
   {q:"5. Litige 1 : quels sont les droits des Ateliers Kerlan face à Voltan ? Répondez avec un syllogisme juridique.",pts:5,r:"<b>Problème juridique</b> : quels sont les recours d'un contractant face à un partenaire qui n'exécute pas son obligation de livraison ?<br><b>Majeure</b> : selon l'article 1217 du Code civil, la partie envers laquelle l'engagement n'a pas été exécuté peut refuser d'exécuter sa propre obligation, poursuivre l'exécution forcée, obtenir une réduction du prix, provoquer la résolution du contrat et demander réparation des conséquences de l'inexécution ; les sanctions compatibles peuvent être cumulées. Le débiteur n'échappe à sa responsabilité qu'en cas de force majeure (article 1218).<br><b>Mineure</b> : Voltan s'était engagé par contrat à livrer 500 batteries le 1er mars. Au 15 avril, rien n'est livré, sans explication : il n'invoque aucun événement de force majeure. Kerlan subit un préjudice : sa production est arrêtée.<br><b>Conclusion</b> : Kerlan peut refuser de payer, exiger la livraison, ou mettre fin au contrat pour se fournir ailleurs, et demander des dommages et intérêts pour l'arrêt de production.<br>Barème : problème 1, majeure 1,5, mineure 1,5, conclusion 1."},
   {q:"6. Litige 2 : sur quel fondement M. Diallo peut-il être indemnisé, et par qui ?",pts:4,r:"Responsabilité du fait des <b>produits défectueux</b> (articles 1245 et suivants du Code civil) : le producteur est responsable du dommage causé par un défaut de son produit, <b>même sans faute</b>. M. Diallo doit prouver le dommage (blessure au poignet), le défaut (frein défectueux) et le lien entre les deux (la chute). C'est la société Les Ateliers Kerlan, personne morale, qui l'indemnise ; ses associés ne sont responsables que dans la limite de leurs apports."}
  ]},
{ id:"ex-cg", titre:"Peut-on se fier aux apparences ?", epreuve:"Culture générale et expression", duree:180,
  intro:`<p class="eyebrow">Format complet de l'épreuve : 3 heures. Partie 1 sur 10 points, partie 2 sur 10 points. Les documents 1 et 2 sont résumés ou écrits pour l'entraînement.</p>`,
  annexes:`<h3>Document 1 : d'après Pline l'Ancien, <i>Histoire naturelle</i>, Ier siècle</h3>
  <p>Deux peintres de la Grèce antique, Zeuxis et Parrhasios, s'affrontent. Zeuxis présente des raisins peints avec tant de réalisme que des oiseaux viennent les picorer. Fier, il demande à son rival d'écarter le rideau qui couvre son tableau. Mais le rideau est lui-même peint. Zeuxis reconnaît sa défaite : il a trompé des oiseaux, Parrhasios a trompé un peintre.</p>
  <h3>Document 2 : texte écrit pour l'entraînement, à la manière d'un article de presse (2026)</h3>
  <p>Il suffit aujourd'hui de quelques mots tapés dans un générateur d'images pour obtenir la photo d'un événement qui n'a jamais eu lieu. Certaines de ces images font le tour des réseaux sociaux en quelques heures, partagées par des internautes de bonne foi. Les spécialistes de la vérification conseillent de regarder les détails (les mains, les textes en arrière-plan), de chercher la source d'origine et de se méfier des images qui provoquent une émotion très forte.</p>
  <h3>Document 3 : Jean de La Fontaine, « Le Corbeau et le Renard », <i>Fables</i>, 1668</h3>
  <p>Le Renard, attiré par le fromage que tient le Corbeau, le couvre de compliments sur sa beauté et sa voix. Flatté, le Corbeau ouvre le bec pour chanter et laisse tomber le fromage. La morale de la fable : « Apprenez que tout flatteur / Vit aux dépens de celui qui l'écoute. »</p>`,
  qs:[
   {q:"Partie 1, question 1. Qu'est-ce qui rend le faux crédible dans les documents 1 et 2 ?",pts:3,r:"Dans les deux cas, le faux trompe parce qu'il <b>ressemble parfaitement au vrai</b> : les raisins et le rideau peints imitent la réalité, les images générées imitent des photographies. Le document 2 ajoute que le faux se répand grâce à la <b>bonne foi</b> de ceux qui le partagent et à l'<b>émotion</b> qu'il provoque."},
   {q:"Partie 1, question 2. Comment le Renard trompe-t-il le Corbeau, et quelle leçon La Fontaine en tire-t-il ?",pts:3,r:"Le Renard ne montre pas une fausse image : il utilise des <b>paroles flatteuses</b>. Il joue sur la vanité du Corbeau, qui veut croire ce qu'on lui dit de beau sur lui. La morale explique que le flatteur profite toujours de celui qui l'écoute : il faut se méfier des discours qui nous font plaisir."},
   {q:"Partie 1, question 3. Le faux est-il toujours condamnable dans ces trois documents ?",pts:4,r:"<b>Non</b>. Dans le document 1, l'illusion est <b>admirée</b> : c'est une preuve de talent, et le public sait qu'il regarde une peinture. Dans les documents 2 et 3, au contraire, le faux sert à <b>tromper</b> : pour obtenir un avantage (le fromage) ou en circulant comme une vraie information. Ce qui rend le faux condamnable, c'est donc l'<b>intention de tromper</b> et le fait de le présenter comme vrai. On remarque aussi que la fable est elle-même une fiction, une histoire « fausse », qui enseigne une vérité."},
   {q:"Partie 2, essai (au choix). Sujet A : « Faut-il toujours dire la vérité ? » Sujet B : « Les images nous trompent-elles plus qu'avant ? »",pts:10,r:"<b>Plan possible pour le sujet A</b> : 1) La vérité est nécessaire : sans elle, pas de confiance (le mensonge du Renard, <i>L'Adversaire</i> de Carrère, les infox). 2) Mais certaines vérités blessent ou mettent en danger, et certains « mensonges » sont acceptables : la politesse, le secret qui protège, la fiction qui dit vrai (le « mentir-vrai » d'Aragon). 3) Ce qui compte : l'intention et les conséquences.<br><b>Plan possible pour le sujet B</b> : 1) Oui, la fabrication d'images fausses est devenue facile et rapide (document 2, hypertrucages). 2) Mais l'illusion par l'image est ancienne (document 1, la propagande du XXe siècle) et elle peut être un art. 3) Ce qui a changé, c'est la vitesse de diffusion : l'esprit critique devient indispensable.<br>Barème indicatif : 2 points pour l'introduction et la conclusion, 6 pour l'argumentation et les exemples, 2 pour la langue."}
  ]}

const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const DAY = 86400000;
const INTERVALS = [1,3,7,14];
let state = { tab:"home", subj: store.get("subj","cejm"), qmode:"subject", qlist:[], quizIdx:0, quizScore:0, train:"cas", exam:null };
let read = store.get("read",{});
let best = store.get("best",{});
let srs = store.get("srs",{});
let examScores = store.get("examScores",{});
let timer = { exam:null, left:0, running:false, last:0 };
const app = document.getElementById("app");
const S = id => SUBJECTS.find(s=>s.id===id);
const ready = s => s.fiches.length>0;
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function today(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function D(a){ return new Date(a[0],a[1]-1,a[2]).getTime(); }
function fmtDate(a){ return new Date(a[0],a[1]-1,a[2]).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}); }
function totalFiches(){ return SUBJECTS.reduce((n,s)=>n+s.fiches.length,0); }
function readCount(){ return Object.values(read).filter(Boolean).length; }
function allQuestions(){ return SUBJECTS.flatMap(s=>s.quiz.map((q,i)=>Object.assign({},q,{id:s.id+"-"+i,subj:s.id}))); }
function dueList(){ const t=today(); return allQuestions().filter(q=>srs[q.id] && srs[q.id].due<=t); }
function pending(){ return Object.keys(srs).length; }
function daysLeft(){ return Math.max(0,Math.ceil((EXAM_DAY.getTime()-today())/DAY)); }
function currentPhase(){ const t=today(); return PLAN.findIndex(p=>t>=D(p.start)&&t<=D(p.end)); }
function todaySession(){ const i=currentPhase(); if(i<0) return null; const p=PLAN[i]; return {phase:p, text:DAYS[p.mode][new Date().getDay()]}; }

function record(id, ok, reviewing){
  const cur = srs[id];
  if(!ok){ srs[id] = {box:0, due:today()+DAY}; }
  else if(cur && reviewing){ const b=cur.box+1; if(b>=INTERVALS.length) delete srs[id]; else srs[id]={box:b, due:today()+INTERVALS[b]*DAY}; }
  store.set("srs",srs);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startQuiz(mode){
  state.qmode = mode; state.quizIdx=0; state.quizScore=0;
  state.qlist = mode==="review" ? shuffle(dueList()) : S(state.subj).quiz.map((q,i)=>Object.assign({},q,{id:state.subj+"-"+i,subj:state.subj}));
}

function selector(kind){
  const opts = SUBJECTS.filter(s=> kind==="fiches"?s.fiches.length:kind==="quiz"?s.quiz.length:s.cas.length);
  if(!opts.find(s=>s.id===state.subj)) state.subj = opts[0].id;
  return `<label class="eyebrow" for="sel-${kind}">Matière</label>
  <select id="sel-${kind}">${opts.map(s=>`<option value="${s.id}" ${s.id===state.subj?"selected":""}>${s.code} · ${s.short}</option>`).join("")}</select>`;
}
function seg(name, items, cur){
  return `<div class="seg" role="tablist">${items.map(([v,l])=>`<button role="tab" aria-selected="${v===cur}" class="${v===cur?"on":""}" data-seg="${name}" data-val="${v}">${l}</button>`).join("")}</div>`;
}

  const due = dueList().length, ts = todaySession();
  return `<div class="top"><div><p class="eyebrow">Brevet de technicien supérieur</p><h1>Comptabilité et Gestion</h1></div>

    <div class="row"><button class="btn" data-review>${due?`À revoir : ${due} question${due>1?"s":""}`:"À revoir : rien aujourd'hui"}</button><button class="btn ghost" data-go="plan">Voir le planning</button></div>
  </div>
  <div class="stats"><div><b>${readCount()}/${totalFiches()}</b><span>fiches maîtrisées</span></div><div><b>${pending()}</b><span>questions en cours de révision</span></div><div><b>${EXAMS.length}</b><span>sujets d'examen</span></div></div>
  <div class="hint"><b>Méthode :</b> lis une fiche, ferme-la, puis fais le quiz sans regarder. Chaque question ratée part dans la pile « À revoir » : elle revient le lendemain, puis 3 jours, 7 jours et 14 jours plus tard. Se tester fait mieux retenir que relire.</div>
  ${groups.map(g=>`<h2 class="group-title">${g}</h2><div class="list">${SUBJECTS.filter(s=>s.group===g).map(s=>`
    <button class="subj" data-open="${s.id}">
      <span class="code">${s.code}</span>
      <span class="t"><span class="n">${s.name}</span><br><span class="s">${s.fiches.length} fiches · ${s.quiz.length} questions${s.cas.length?` · ${s.cas.length} cas`:""}</span></span>
      <span class="pill">${s.fiches.filter((f,i)=>read[s.id+"-"+i]).length}/${s.fiches.length}</span>
    </button>`).join("")}</div>`).join("")}`;
}

function fiches(){
  const s = S(state.subj);
  return `<div class="stack"><div><p class="eyebrow">Fiches de cours</p><h1>${s.name}</h1></div>${selector("fiches")}
  ${s.fiches.map((f,i)=>{ const k=s.id+"-"+i; return `<details class="fiche" id="f-${k}">
    <summary><span class="t"><h3>${f.titre}</h3><span class="freq">${f.freq}</span> ${read[k]?'<span class="done">✓ maîtrisée</span>':""}</span>
    <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></summary>
    <div class="fbody">${f.html}<button class="mark ${read[k]?"on":""}" data-read="${k}">${read[k]?"✓ Fiche maîtrisée":"Marquer comme maîtrisée"}</button></div></details>`; }).join("")}</div>`;
}

function quiz(){
  const head = `<div><p class="eyebrow">Quiz corrigé</p><h1>${state.qmode==="review"?"Pile « À revoir »":S(state.subj).short}</h1></div>
  ${seg("qmode",[["subject","Par matière"],["review",`À revoir (${dueList().length})`]],state.qmode)}`;
  if(state.qmode==="subject" && !state.qlist.length) startQuiz("subject");
  const Q = state.qlist;
  if(state.qmode==="review" && !Q.length){
    return `<div class="stack">${head}<div class="panel stack"><h2>Rien à revoir aujourd'hui</h2><p>${pending()?`${pending()} question${pending()>1?"s":""} reviendront dans les prochains jours.`:"Fais un quiz par matière : chaque question ratée viendra s'ajouter ici."}</p><button class="btn" data-seg="qmode" data-val="subject">Faire un quiz par matière</button></div></div>`;
  }
  if(state.quizIdx>=Q.length){
    const pct = Math.round(state.quizScore/Q.length*100);
    return `<div class="stack">${head}<div class="panel stack"><span class="big">${state.quizScore}/${Q.length}</span>
    <p>${pct>=80?"Très bien. Les questions ratées reviendront demain dans la pile « À revoir ».":pct>=50?"En bonne voie. Relis les fiches des questions ratées : elles reviendront demain dans la pile « À revoir ».":"Normal au début. Relis les fiches une par une ; les questions ratées reviendront demain."}</p>
    ${state.qmode==="subject"?`<p class="eyebrow">Meilleur score : ${best[state.subj]??state.quizScore}/${Q.length}</p>`:""}</div>
    <div class="row"><button class="btn" data-restart>Recommencer</button><button class="btn ghost" data-go="fiches">Relire les fiches</button></div></div>`;
  }
  const q = Q[state.quizIdx];
  return `<div class="stack">${head}${state.qmode==="subject"?selector("quiz"):`<p class="s">Matière : ${S(q.subj).code} · ${S(q.subj).short}</p>`}
  <div class="bar"><i style="width:${state.quizIdx/Q.length*100}%"></i></div>
  <p class="eyebrow">Question ${state.quizIdx+1} sur ${Q.length} · score ${state.quizScore}</p>
  <div class="panel stack"><p class="q">${q.q}</p><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-ans="${i}">${o}</button>`).join("")}</div>
  <div id="fb" hidden></div></div></div>`;
}

function casView(){
  const s = S(state.subj);
  return `${selector("cas")}
  <div class="hint"><b>Comment faire :</b> réponds sur une feuille à chaque question, puis seulement ensuite affiche la correction.</div>
  ${s.cas.map(c=>`<div class="panel stack"><h2>${c.titre}</h2>${c.enonce}
    ${c.qs.map(q=>`<div><p><b>${q.q}</b></p><button class="btn ghost reveal" data-rev>Voir la correction</button><div class="ans" hidden>${q.r}</div></div>`).join("")}</div>`).join("")}`;
}
function fmtTime(sec){ const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+" h ":"")+String(m).padStart(2,"0")+" min "+String(s).padStart(2,"0"); }
function examView(){
  if(!state.exam){
    return `<div class="hint"><b>Conditions réelles :</b> lance le minuteur, travaille sur une feuille sans regarder tes fiches, puis corrige-toi avec le barème.</div>
    ${EXAMS.map(e=>{ const sc=examScores[e.id]; const tot=e.qs.reduce((n,q)=>n+q.pts,0); return `<button class="subj" data-exam="${e.id}"><span class="code">${e.duree>=60?Math.floor(e.duree/60)+" h"+(e.duree%60?" "+e.duree%60:""):e.duree+" min"}</span><span class="t"><span class="n">${e.titre}</span><br><span class="s">${e.epreuve}</span></span><span class="pill">${sc&&sc.done?sc.total+"/"+tot:"À faire"}</span></button>`; }).join("")}`;
  }
  const e = EXAMS.find(x=>x.id===state.exam); const sc = examScores[e.id]||{pts:{}};
  const tot = e.qs.reduce((n,q)=>n+q.pts,0);
  if(timer.exam!==e.id){ timer={exam:e.id,left:e.duree*60,running:false,last:0}; }
  const total = e.qs.reduce((n,q,i)=>n+(+sc.pts[i]||0),0);
  return `<button class="back" data-exam="">← Tous les sujets</button>
  <div><p class="eyebrow">${e.epreuve}</p><h2>${e.titre}</h2></div>
  <div class="timer panel"><span id="clock" class="clock">${fmtTime(timer.left)}</span>
    <div class="row"><button class="btn" data-timer="toggle">${timer.running?"Pause":"Lancer le minuteur"}</button><button class="btn ghost" data-timer="reset">Remettre à zéro</button></div></div>
  ${e.intro}
  <div class="panel stack sujet">${e.annexes}</div>
  <h2>Travail à faire</h2>
  ${e.qs.map((q,i)=>`<div class="panel stack"><p><b>${q.q}</b> <span class="pill">${q.pts} point${q.pts>1?"s":""}</span></p>
    <button class="btn ghost reveal" data-rev>Voir la correction</button><div class="ans" hidden>${q.r}</div>
    <label class="score">Mes points : <input type="number" inputmode="decimal" min="0" max="${q.pts}" step="0.5" id="sc-${e.id}-${i}" data-score="${i}" value="${sc.pts[i]??""}"> / ${q.pts}</label></div>`).join("")}
  <div class="panel stack"><p class="eyebrow">Ma note</p><span class="big" id="examTotal">${total}/${tot}</span><button class="btn" data-savescore>Enregistrer ma note</button></div>`;
}
function train(){
  return `<div class="stack"><div><p class="eyebrow">Entraînement</p><h1>${state.train==="cas"?"Cas pratiques corrigés":"Sujets d'examen chronométrés"}</h1></div>
  ${seg("train",[["cas","Cas pratiques"],["exam","Sujets d'examen"]],state.train)}
  ${state.train==="cas"?casView():examView()}</div>`;
}

function plan(){
  const ci = currentPhase(), t = today();
  return `<div class="stack"><div><p class="eyebrow">Planning jusqu'à l'examen</p><h1>J−${daysLeft()}</h1>
  <p class="s">Premières épreuves écrites le mardi 11 mai 2027. Le planning tient compte de ton stage en cabinet de janvier à mi-mars.</p></div>
  ${PLAN.map((p,i)=>{ const st = i===ci?"now":(D(p.end)<t?"past":"next"); return `<div class="phase ${st}">
    <div class="ph-head"><span class="ph-date">${fmtDate(p.start)} → ${fmtDate(p.end)}</span>${st==="now"?'<span class="pill">En cours</span>':st==="past"?'<span class="pill later">Terminé</span>':""}</div>
    <h3>${p.titre}</h3>${p.minutes?`<p class="s">Environ ${p.minutes} minutes par jour</p>`:""}
    <ul>${p.focus.map(f=>`<li>${f}</li>`).join("")}</ul>
    ${st==="now"?`<details class="week"><summary>Ma semaine type</summary><ul>${["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"].map((d,j)=>`<li><b>${d}</b> : ${DAYS[p.mode][(j+1)%7]}</li>`).join("")}</ul></details>`:""}
  </div>`; }).join("")}
  <div class="trap"><span class="lab">À vérifier</span>Les dates de l'étude de cas, des mathématiques et des oraux figurent sur ta convocation. Demande aussi à SFA Formation quelles épreuves se passent en contrôle en cours de formation.</div></div>`;
}

function render(){
  const v = {home, fiches, quiz, train, plan}[state.tab];
  app.innerHTML = v();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===state.tab));
}
function go(tab){ state.tab=tab; if(tab==="quiz" && state.qmode==="subject") startQuiz("subject"); render(); window.scrollTo(0,0); }

/* ===================== MINUTEUR ===================== */
setInterval(()=>{
  if(!timer.running) return;
  const now=Date.now(); const d=Math.floor((now-timer.last)/1000);
  if(d>=1){ timer.left=Math.max(0,timer.left-d); timer.last+=d*1000; if(!timer.left) timer.running=false;
    const c=document.getElementById("clock"); if(c){ c.textContent = timer.left?fmtTime(timer.left):"Temps écoulé"; if(!timer.running){ const b=document.querySelector('[data-timer="toggle"]'); if(b) b.textContent="Lancer le minuteur"; } } }
}, 250);

/* ===================== INTERACTIONS ===================== */
document.querySelector("nav.tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) go(b.dataset.tab); });
app.addEventListener("change",e=>{
  if(e.target.tagName==="SELECT"){ state.subj=e.target.value; store.set("subj",state.subj); if(state.tab==="quiz") startQuiz("subject"); render(); }
});
app.addEventListener("input",e=>{
  if(e.target.dataset.score!==undefined){
    const ex=EXAMS.find(x=>x.id===state.exam); const sc=examScores[ex.id]||(examScores[ex.id]={pts:{}});
    const i=+e.target.dataset.score; const v=Math.min(ex.qs[i].pts,Math.max(0,parseFloat(e.target.value.replace(",","."))||0));
    sc.pts[i]= e.target.value===""?"":v; sc.total = ex.qs.reduce((n,q,j)=>n+(+sc.pts[j]||0),0);
    store.set("examScores",examScores);
    const t=document.getElementById("examTotal"); if(t) t.textContent = sc.total+"/"+ex.qs.reduce((n,q)=>n+q.pts,0);
  }
});
app.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.open){ state.subj=t.dataset.open; store.set("subj",state.subj); go("fiches"); return; }
  if(t.dataset.review!==undefined){ state.tab="quiz"; startQuiz("review"); render(); window.scrollTo(0,0); return; }
  if(t.dataset.seg==="qmode"){ startQuiz(t.dataset.val); render(); return; }
  if(t.dataset.seg==="train"){ state.train=t.dataset.val; render(); return; }
  if(t.dataset.read){ const k=t.dataset.read; read[k]=!read[k]; store.set("read",read); render(); const nd=document.getElementById("f-"+k); if(nd) nd.open=true; return; }
  if(t.dataset.ans!==undefined){
    const q=state.qlist[state.quizIdx], i=+t.dataset.ans;
    document.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(j===q.a) b.classList.add("good"); else if(j===i) b.classList.add("wrong"); });
    const ok=i===q.a; if(ok) state.quizScore++;
    record(q.id, ok, state.qmode==="review");
    const fb=document.getElementById("fb"); fb.hidden=false;
    fb.innerHTML=`<div class="feedback"><b style="color:var(${ok?"--ok":"--bad"})">${ok?"Bonne réponse.":"Pas tout à fait."}</b> ${q.e}${ok?"":" <i>Cette question revient demain dans la pile « À revoir ».</i>"}</div><button class="btn" data-next style="margin-top:10px">${state.quizIdx+1<state.qlist.length?"Question suivante":"Voir mon score"}</button>`;
    return;
  }
  if(t.dataset.next!==undefined){ state.quizIdx++; if(state.quizIdx>=state.qlist.length && state.qmode==="subject"){ best[state.subj]=Math.max(best[state.subj]||0,state.quizScore); store.set("best",best);} render(); window.scrollTo(0,0); return; }
  if(t.dataset.restart!==undefined){ startQuiz(state.qmode); render(); return; }
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.exam!==undefined){ state.exam=t.dataset.exam||null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.timer==="toggle"){ if(!timer.left) return; timer.running=!timer.running; timer.last=Date.now(); t.textContent=timer.running?"Pause":"Reprendre"; return; }
  if(t.dataset.timer==="reset"){ const ex=EXAMS.find(x=>x.id===state.exam); timer={exam:ex.id,left:ex.duree*60,running:false,last:0}; render(); return; }
  if(t.dataset.savescore!==undefined){ const sc=examScores[state.exam]||(examScores[state.exam]={pts:{}}); sc.total=EXAMS.find(x=>x.id===state.exam).qs.reduce((n,q,j)=>n+(+sc.pts[j]||0),0); sc.done=true; store.set("examScores",examScores); t.textContent="✓ Note enregistrée"; return; }
  if(t.dataset.rev!==undefined){ const a=t.nextElementSibling; a.hidden=!a.hidden; t.textContent=a.hidden?"Voir la correction":"Masquer la correction"; }
});
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>

</body>
</html>
