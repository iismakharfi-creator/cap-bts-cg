<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#5cc492; --accent-soft:#1b3328; --gold:#e3ab4a; --gold-soft:#33280f;
  --ok:#5cc492; --ok-soft:#173225; --bad:#f08a7f; --bad-soft:#3a1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --card:#18211c; --ink:#e6eee8; --muted:#9db0a4; --line:#2a3630;
  --accent:#5cc492; --accent-soft:#1b3328; --gold:#e3ab4a; --gold-soft:#33280f;
  --ok:#5cc492; --ok-soft:#173225; --bad:#f08a7f; --bad-soft:#3a1d1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.55}
.wrap{max-width:660px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}

.stack{display:flex;flex-direction:column;gap:14px}

.count b{display:block;font-size:1.5rem;color:var(--accent);font-family:var(--display)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hint{background:var(--gold-soft);border-radius:12px;padding:14px 16px;font-size:.97rem}

.subj:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.code{flex:none;width:52px;height:44px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-size:.82rem;background:var(--accent-soft);color:var(--accent)}

.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}

.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}

.today h2{color:#fff}
.today .btn{background:#fff;color:#17231d}.today .btn.ghost{background:transparent;color:#fff;border-color:#cfe6d9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stats b{display:block;font-family:var(--display);font-size:1.35rem;color:var(--accent);font-variant-numeric:tabular-nums}
.stats span{font-size:.78rem;color:var(--muted);line-height:1.25;display:block}
.wrap>.hint{margin-bottom:4px}
.phase{border-left:4px solid var(--line);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.phase.now{border-left-color:var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px 14px}
.phase.past{opacity:.6}
.phase ul{margin:2px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.ph-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph-date{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.week summary{cursor:pointer;font-weight:700;color:var(--accent);margin-top:6px}
.week ul{margin-top:6px}
.clock{font-family:var(--mono);font-size:1.6rem;color:var(--accent);font-variant-numeric:tabular-nums}
.timer{display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3}

.score input{width:76px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.back{background:none;border:none;font:inherit;font-weight:700;color:var(--accent);padding:4px 0;cursor:pointer;text-align:left}
.ex .lab{color:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:flex;width:100%;max-width:660px}
nav.tabs button{flex:1;min-width:0;background:none;border:none;font:inherit;font-size:.7rem;font-weight:600;color:var(--muted);padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-top:3px solid transparent}
nav.tabs button.on{color:var(--accent);border-top-color:var(--accent)}
nav.tabs svg{width:22px;height:22px}

<script>
/* ===================== CONTENU ===================== */
const SUBJECTS = [
{ id:"cejm", code:"CEJM", group:"Matières générales", name:"Culture économique, juridique et managériale", short:"Économie, droit et management",
  fiches:[
  { titre:"Économie ou management : comment ne plus les confondre", freq:"Indispensable pour ton contrôle", html:`
    <p>Les deux matières parlent d'entreprises, d'argent et de décisions, c'est pour ça qu'on les mélange. La vraie différence, c'est <b>l'endroit d'où on regarde</b>.</p>
    <div class="def"><b>L'économie</b> regarde <b>de loin</b> : un pays, un marché, des millions de personnes. Elle étudie comment on produit les richesses, comment on les partage et comment on les consomme.</div>
    <div class="def"><b>Le management</b> regarde <b>de l'intérieur d'une organisation</b> : une entreprise, une association, une mairie. Il étudie comment on la dirige, comment on prend les décisions, comment on fait travailler les gens ensemble.</div>
    <div class="ex"><span class="lab">Exemple</span>Le prix du café augmente partout en France : c'est de l'<b>économie</b> (un marché, des prix, des consommateurs).<br>Le gérant d'un bar décide d'acheter un autre fournisseur de café moins cher et réorganise les horaires de ses serveurs : c'est du <b>management</b> (une organisation qui prend une décision).</div>
    <div class="tip"><span class="lab">Astuce pour l'examen</span>Pose-toi une seule question : « Est-ce qu'on parle de ce qui se passe <b>dans</b> une organisation précise, ou de ce qui se passe <b>autour</b>, sur le marché ou dans le pays ? » Dedans = management. Autour = économie.</div>
    <div class="tbl"><table><tr><th>Mots qui annoncent de l'économie</th><th>Mots qui annoncent du management</th></tr>
    <tr><td>marché, prix, offre, demande, croissance, inflation, chômage, produit intérieur brut, agents économiques, État, concurrence</td><td>organisation, finalité, objectifs, stratégie, décision, dirigeant, salariés, motivation, style de direction, diagnostic, structure</td></tr></table></div>`},
  { titre:"Les agents économiques", freq:"Très fréquent", html:`
    <p>Un <b>agent économique</b>, c'est une personne ou un groupe qui fait des choix économiques (produire, consommer, épargner…). On en compte cinq grandes familles.</p>
    <div class="tbl"><table><tr><th>Agent</th><th>Son rôle principal</th><th>Exemple</th></tr>
    <tr><td>Les ménages</td><td>Consommer et épargner</td><td>Une famille qui fait ses courses</td></tr>
    <tr><td>Les entreprises</td><td>Produire des biens et des services pour les vendre</td><td>Une boulangerie, Renault</td></tr>
    <tr><td>Les administrations publiques</td><td>Rendre des services gratuits ou presque, payés par les impôts</td><td>L'école publique, l'hôpital, la mairie</td></tr>
    <tr><td>Les institutions financières</td><td>Prêter de l'argent et garder l'épargne</td><td>Une banque, une assurance</td></tr>
    <tr><td>Le reste du monde</td><td>Échanger avec le pays (importations et exportations)</td><td>Une entreprise chinoise qui vend en France</td></tr></table></div>
    <p>Ces agents sont reliés par des échanges : c'est le <b>circuit économique</b>. Les ménages donnent leur travail aux entreprises, qui leur versent un salaire ; avec ce salaire, les ménages achètent les produits des entreprises.</p>
    <div class="ex"><span class="lab">Exemple</span>Tu travailles au centre social (tu fournis ton travail), tu reçois ton salaire, tu l'utilises pour acheter un téléphone (tu consommes) et tu mets 50 euros sur ton livret A (tu épargnes, et la banque pourra prêter cet argent à quelqu'un d'autre).</div>`},
  { titre:"Le marché : offre, demande et prix", freq:"Très fréquent", html:`
    <div class="def">Un <b>marché</b> est le lieu, réel ou virtuel, où se rencontrent ceux qui vendent (<b>l'offre</b>) et ceux qui achètent (<b>la demande</b>). De cette rencontre naît un <b>prix</b>.</div>
    <ul><li>Quand le prix monte, les acheteurs achètent <b>moins</b> et les vendeurs veulent vendre <b>plus</b>.</li>
    <li>Le <b>prix d'équilibre</b> est le prix où la quantité que les vendeurs proposent est égale à la quantité que les acheteurs veulent.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Au marché, en fin de matinée, un maraîcher a encore beaucoup de fraises (offre trop forte) : il baisse son prix pour les écouler. À l'inverse, s'il ne lui reste que trois barquettes et que dix clients en veulent, il peut monter le prix.</div>
    <p><b>Auteur à connaître :</b> <b>Adam Smith</b> (1776) parle de « main invisible » : chacun cherche son propre intérêt, et le marché, par les prix, organise tout seul les échanges.</p>
    <p><b>Les structures de marché</b> selon le nombre de vendeurs :</p>
    <ul><li><b>Concurrence</b> : beaucoup de vendeurs (les boulangeries d'une grande ville).</li>
    <li><b>Oligopole</b> : quelques gros vendeurs (les opérateurs de téléphone : Orange, SFR, Bouygues, Free).</li>
    <li><b>Monopole</b> : un seul vendeur (la Société nationale des chemins de fer, SNCF, a longtemps été seule à faire rouler des trains en France).</li></ul>`},
  { titre:"La création de richesse : valeur ajoutée et produit intérieur brut", freq:"Fréquent", html:`
    <div class="def"><b>Valeur ajoutée</b> = ce que l'entreprise vend − ce qu'elle a acheté à d'autres entreprises pour produire (les <b>consommations intermédiaires</b>). C'est la richesse réellement créée par l'entreprise.</div>
    <div class="ex"><span class="lab">Exemple</span>Un boulanger vend 10 000 euros de pain dans le mois. Il a acheté 3 000 euros de farine, de beurre et d'électricité.<br>Valeur ajoutée = 10 000 − 3 000 = <b>7 000 euros</b>. Ces 7 000 euros servent à payer ses salariés, les impôts, les intérêts à la banque, et le reste est son bénéfice.</div>
    <div class="def"><b>Produit intérieur brut (PIB)</b> = la somme de toutes les valeurs ajoutées créées dans un pays pendant un an. C'est l'indicateur de la richesse produite par un pays.</div>
    <div class="def"><b>Croissance économique</b> = l'augmentation du produit intérieur brut d'une année sur l'autre, en pourcentage.</div>
    <div class="trap"><span class="lab">Piège</span>On n'additionne pas les chiffres d'affaires : la farine serait comptée deux fois (dans le prix du meunier et dans le prix du pain). C'est pour ça qu'on utilise la valeur ajoutée.</div>`},
  { titre:"Les organisations et leurs finalités", freq:"Très fréquent", html:`
    <div class="def">Une <b>organisation</b> est un groupe de personnes qui travaillent ensemble, avec des moyens, pour atteindre un but commun.</div>
    <div class="tbl"><table><tr><th>Type</th><th>Finalité (but profond)</th><th>Exemple</th></tr>
    <tr><td>Entreprise privée</td><td><b>Lucrative</b> : faire des bénéfices</td><td>Carrefour, un salon de coiffure</td></tr>
    <tr><td>Organisation publique</td><td><b>Non lucrative</b> : servir l'intérêt général</td><td>Un hôpital public, une mairie</td></tr>
    <tr><td>Association</td><td><b>Non lucrative</b> : réaliser un projet commun, souvent social</td><td>Un centre social, les Restos du cœur</td></tr></table></div>
    <p><b>Finalité, buts, objectifs</b> : du plus général au plus précis.</p>
    <ul><li><b>Finalité</b> : la raison d'être (exemple : aider les familles du quartier).</li>
    <li><b>But</b> : une orientation (exemple : développer l'aide aux devoirs).</li>
    <li><b>Objectif</b> : chiffré et daté (exemple : accueillir 40 enfants en aide aux devoirs d'ici juin).</li></ul>
    <div class="tip"><span class="lab">Astuce</span>Un objectif bien rédigé est <b>mesurable</b> (un chiffre) et <b>daté</b> (une échéance). Si ton sujet demande de « formuler un objectif », mets toujours les deux.</div>`},
  { titre:"Le management : définition et auteurs clés", freq:"Très fréquent", html:`
    <div class="def">Le <b>management</b> est l'ensemble des actions pour diriger une organisation : fixer les objectifs, prendre les décisions, organiser le travail, animer les équipes et contrôler les résultats.</div>
    <p><b>Henri Fayol</b> (1916) décrit cinq fonctions du dirigeant. Moyen mnémotechnique : <b>« PO3C »</b>.</p>
    <ul><li><b>P</b>révoir : anticiper l'avenir, faire des plans.</li>
    <li><b>O</b>rganiser : répartir les tâches et les moyens.</li>
    <li><b>C</b>ommander : donner les ordres.</li>
    <li><b>C</b>oordonner : faire en sorte que tout le monde avance dans le même sens.</li>
    <li><b>C</b>ontrôler : vérifier que les résultats sont atteints.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>La directrice d'un centre social prévoit le planning des vacances (prévoir), répartit les animateurs par activité (organiser), demande à chacun de préparer son atelier (commander), organise une réunion pour que les ateliers ne se chevauchent pas (coordonner), et fait le bilan des inscriptions à la fin (contrôler).</div>
    <p><b>Henry Mintzberg</b> (1973) observe que le manager joue dix rôles, regroupés en trois familles : <b>interpersonnels</b> (représenter, motiver), <b>informationnels</b> (recueillir et transmettre l'information), <b>décisionnels</b> (décider, négocier, répartir les ressources).</p>`},
  { titre:"La prise de décision", freq:"Fréquent", html:`
    <p><b>Igor Ansoff</b> classe les décisions en trois niveaux :</p>
    <div class="tbl"><table><tr><th>Niveau</th><th>Qui décide</th><th>Durée de l'effet</th><th>Exemple</th></tr>
    <tr><td>Stratégique</td><td>La direction</td><td>Long terme, engage l'avenir</td><td>Ouvrir un deuxième magasin</td></tr>
    <tr><td>Tactique (ou administrative)</td><td>Les cadres intermédiaires</td><td>Moyen terme</td><td>Choisir le fournisseur de la nouvelle boutique</td></tr>
    <tr><td>Opérationnelle</td><td>Les employés, chefs d'équipe</td><td>Court terme, répétitive</td><td>Commander le stock de la semaine</td></tr></table></div>
    <p><b>Herbert Simon</b> parle de <b>rationalité limitée</b> : un décideur n'a jamais toutes les informations ni tout le temps nécessaire. Il ne choisit donc pas la solution parfaite, mais la <b>première solution satisfaisante</b>.</p>
    <div class="ex"><span class="lab">Exemple</span>Tu cherches une salle pour une réunion de parents. Tu ne visites pas toutes les salles de la ville : tu prends la première qui est libre, assez grande et pas trop chère. C'est la rationalité limitée.</div>`},
  { titre:"Les styles de direction (Likert)", freq:"Fréquent", html:`
    <p><b>Rensis Likert</b> distingue quatre styles, du plus fermé au plus ouvert :</p>
    <ul><li><b>Autoritaire exploiteur</b> : le chef décide seul, menace et sanctionne.</li>
    <li><b>Autoritaire paternaliste</b> : le chef décide seul mais se montre bienveillant, « comme un père ».</li>
    <li><b>Consultatif</b> : le chef demande l'avis des salariés, puis décide seul.</li>
    <li><b>Participatif</b> : les décisions sont prises avec les salariés.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Pour changer les horaires d'ouverture, la direction organise un sondage auprès de l'équipe, écoute les remarques, puis tranche elle-même : style <b>consultatif</b>. Si l'équipe vote et que la direction applique le résultat : style <b>participatif</b>.</div>
    <div class="trap"><span class="lab">Piège</span>Consulter, ce n'est pas faire participer. Regarde <b>qui prend la décision finale</b>.</div>`},
  { titre:"Le diagnostic stratégique : SWOT et cinq forces de Porter", freq:"Très fréquent", html:`
    <p>Avant de choisir une stratégie, on fait un <b>diagnostic</b> : on regarde l'organisation et son environnement.</p>
    <p><b>La matrice SWOT</b> (de l'anglais Strengths, Weaknesses, Opportunities, Threats : forces, faiblesses, opportunités, menaces) :</p>
    <div class="tbl"><table><tr><th></th><th>Positif</th><th>Négatif</th></tr>
    <tr><th>Interne (dépend de l'organisation)</th><td>Forces</td><td>Faiblesses</td></tr>
    <tr><th>Externe (vient de l'environnement)</th><td>Opportunités</td><td>Menaces</td></tr></table></div>
    <div class="ex"><span class="lab">Exemple</span>Un petit restaurant : <b>force</b> = un chef reconnu ; <b>faiblesse</b> = une salle trop petite ; <b>opportunité</b> = un nouveau bureau de 300 salariés ouvre dans la rue ; <b>menace</b> = un fast-food s'installe en face.</div>
    <div class="trap"><span class="lab">Piège classique</span>Une opportunité ou une menace ne dépend <b>pas</b> de l'entreprise. « Nos prix sont trop élevés » est une faiblesse (interne), pas une menace.</div>
    <p><b>Michael Porter</b> : cinq forces qui déterminent la concurrence dans un secteur : (1) la rivalité entre concurrents, (2) le pouvoir des clients, (3) le pouvoir des fournisseurs, (4) la menace de nouveaux entrants, (5) la menace des produits de substitution.</p>
    <div class="ex"><span class="lab">Exemple</span>Pour les taxis, Uber a été à la fois un <b>nouvel entrant</b> et un concurrent ; les trottinettes électriques sont un <b>produit de substitution</b> (elles répondent au même besoin : se déplacer).</div>`},
  { titre:"Droit : la méthode du syllogisme juridique", freq:"Tombe à chaque session", html:`
    <p>En droit, on te donne une situation et on te demande si une personne a raison. On répond toujours avec la même méthode en trois temps : le <b>syllogisme juridique</b>.</p>
    <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
    <li><b>Le problème juridique</b> : la question posée de façon générale, <b>sans les noms</b> des personnes.</li>
    <li><b>La majeure</b> : la règle de droit qui répond, avec sa source (article de loi, du Code civil, du Code du travail…).</li>
    <li><b>La mineure</b> : les faits de l'énoncé, traduits en mots juridiques (qui est consommateur, quel contrat, quelles dates).</li>
    <li><b>La conclusion</b> : on applique la règle aux faits et on répond clairement à la question.</li></ol>
    <div class="ex"><span class="lab">Exemple</span>Lucas achète un casque sur un site internet. Il le reçoit le 5 mars et veut le renvoyer le 15 mars, sans raison particulière.<br>
    <b>Problème juridique</b> : un consommateur qui a acheté un bien à distance peut-il revenir sur son achat sans donner de motif ?<br>
    <b>Majeure</b> : selon l'article L221-18 du Code de la consommation, le consommateur dispose de 14 jours pour exercer son droit de rétractation, sans motif ni pénalité. Pour un bien, le délai court à partir de la réception.<br>
    <b>Mineure</b> : Lucas est un consommateur qui a conclu un contrat à distance. Il a reçu le casque le 5 mars et veut se rétracter le 15 mars, soit 10 jours après.<br>
    <b>Conclusion</b> : Lucas est dans le délai de 14 jours : il peut renvoyer le casque et être remboursé.</div>
    <div class="trap"><span class="lab">Piège</span>Un problème juridique qui contient un nom propre (« Lucas peut-il… ») perd des points. Écris « un consommateur peut-il… ».</div>`},
  { titre:"Droit : les formes juridiques de l'entreprise", freq:"Très fréquent", html:`
    <div class="def">Une <b>société</b> est une <b>personne morale</b> : elle a son propre nom, son propre patrimoine, elle peut signer des contrats. Elle est distincte de ses associés.</div>
    <div class="tbl"><table><tr><th>Forme</th><th>Associés</th><th>Responsabilité pour les dettes</th><th>Dirigeant</th></tr>
    <tr><td>Entreprise individuelle</td><td>1 personne, pas de société</td><td>Depuis 2022, seuls les biens utiles à l'activité peuvent être saisis par les créanciers professionnels ; le patrimoine personnel est protégé</td><td>L'entrepreneur</td></tr>
    <tr><td>Société à responsabilité limitée</td><td>1 à 100 (avec 1 seul associé, on parle d'entreprise unipersonnelle à responsabilité limitée)</td><td>Limitée aux apports</td><td>Un ou plusieurs gérants</td></tr>
    <tr><td>Société par actions simplifiée</td><td>1 ou plus (avec 1 seul : société par actions simplifiée unipersonnelle)</td><td>Limitée aux apports</td><td>Un président, organisation libre fixée par les statuts</td></tr>
    <tr><td>Société anonyme</td><td>2 au minimum (7 si elle est cotée en Bourse)</td><td>Limitée aux apports</td><td>Conseil d'administration et directeur général</td></tr></table></div>
    <div class="ex"><span class="lab">Exemple</span>Deux amies créent une boutique de loisirs créatifs en société à responsabilité limitée, avec 5 000 euros d'apport chacune. Si la boutique fait faillite avec 40 000 euros de dettes, chacune perd au maximum ses 5 000 euros : les créanciers ne peuvent pas saisir leur appartement.</div>`},
  { titre:"Droit : la formation du contrat", freq:"Très fréquent", html:`
    <div class="def">Un <b>contrat</b> est un accord de volontés entre deux personnes ou plus, qui crée des obligations (payer, livrer, travailler…).</div>
    <p>Selon l'article 1128 du Code civil, un contrat est valable s'il réunit <b>trois conditions</b> :</p>
    <ul><li>le <b>consentement</b> des parties (elles sont d'accord, librement et en connaissance de cause) ;</li>
    <li>leur <b>capacité</b> de contracter (un mineur ou un majeur protégé ne peut pas tout signer seul) ;</li>
    <li>un <b>contenu licite et certain</b> (on ne peut pas vendre quelque chose d'interdit ou d'indéterminé).</li></ul>
    <p><b>Les vices du consentement</b> (articles 1130 et suivants) : le consentement existe mais il est « abîmé ».</p>
    <ul><li><b>L'erreur</b> : on se trompe soi-même sur une qualité essentielle (acheter une copie en croyant acheter un tableau original).</li>
    <li><b>Le dol</b> : l'autre partie a menti, manœuvré ou volontairement caché une information importante.</li>
    <li><b>La violence</b> : on a signé sous la menace ou la pression, y compris en profitant d'un état de dépendance.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Un vendeur de voitures d'occasion trafique le compteur pour afficher 60 000 kilomètres au lieu de 180 000. C'est un <b>dol</b>. L'acheteur peut demander la <b>nullité</b> du contrat (il rend la voiture, on lui rend son argent) et des dommages et intérêts.</div>`},
  { titre:"Droit : l'inexécution du contrat", freq:"Très fréquent", html:`
    <p>Quand une partie ne fait pas ce qu'elle a promis, l'article 1217 du Code civil donne <b>cinq possibilités</b> à l'autre partie, qu'elle peut parfois cumuler :</p>
    <ul><li><b>Refuser d'exécuter sa propre obligation</b> (exception d'inexécution) : je ne paie pas tant que tu ne livres pas.</li>
    <li><b>Demander l'exécution forcée</b> : obliger l'autre à faire ce qu'il a promis.</li>
    <li><b>Obtenir une réduction du prix</b> si l'exécution est imparfaite.</li>
    <li><b>Demander la résolution</b> du contrat : on y met fin.</li>
    <li><b>Demander des dommages et intérêts</b> pour réparer le préjudice.</li></ul>
    <div class="def"><b>Exception : la force majeure</b> (article 1218). Si l'inexécution vient d'un événement qui échappe au contrôle du débiteur, qui était imprévisible au moment de signer et dont on ne peut pas éviter les effets, le débiteur n'est pas responsable.</div>
    <div class="ex"><span class="lab">Exemple</span>Un traiteur devait livrer le buffet d'un mariage et ne vient pas, sans explication. Les mariés peuvent refuser de payer, demander la fin du contrat et réclamer des dommages et intérêts pour le repas qu'ils ont dû commander en urgence. Si la salle avait été inondée par une crue exceptionnelle, le traiteur pourrait invoquer la force majeure.</div>`},
  { titre:"Droit : la responsabilité civile", freq:"Fréquent", html:`
    <div class="def">La <b>responsabilité civile</b> oblige une personne à <b>réparer le dommage</b> qu'elle a causé à une autre, en général en lui versant de l'argent (des dommages et intérêts).</div>
    <ul><li><b>Responsabilité contractuelle</b> : le dommage vient de la mauvaise exécution d'un contrat.</li>
    <li><b>Responsabilité extracontractuelle</b> : il n'y a pas de contrat entre la victime et l'auteur. Selon l'article 1240 du Code civil, celui qui cause un dommage à autrui par sa faute doit le réparer.</li></ul>
    <p>Trois conditions à vérifier, toujours :</p>
    <ul><li>un <b>fait générateur</b> (une faute, le fait d'une chose, le fait d'une autre personne) ;</li>
    <li>un <b>dommage</b> (matériel, corporel ou moral) ;</li>
    <li>un <b>lien de causalité</b> entre les deux.</li></ul>
    <p><b>Cas particuliers utiles</b> : l'employeur est responsable des dommages causés par ses salariés pendant leur travail (article 1242). Le fabricant est responsable des dommages causés par un défaut de son produit, même sans faute (articles 1245 et suivants).</p>
    <div class="ex"><span class="lab">Exemple</span>Un livreur renverse un piéton en reculant pendant sa tournée. Le piéton est blessé (dommage) à cause de la manœuvre du livreur (fait générateur et lien de causalité). C'est l'<b>employeur</b> du livreur qui devra indemniser la victime.</div>`},
  { titre:"Droit : le contrat de travail et sa rupture", freq:"Fréquent", html:`
    <p>Un contrat de travail suppose trois éléments : une <b>prestation de travail</b>, une <b>rémunération</b> et un <b>lien de subordination</b> (l'employeur donne des ordres, contrôle et peut sanctionner).</p>
    <div class="tbl"><table><tr><th>Mode de rupture</th><th>Qui décide</th><th>À retenir</th></tr>
    <tr><td>Démission</td><td>Le salarié</td><td>Sa volonté doit être claire et sans ambiguïté. Pas d'allocations chômage en principe.</td></tr>
    <tr><td>Licenciement</td><td>L'employeur</td><td>Il faut une <b>cause réelle et sérieuse</b> (article L1232-1 du Code du travail), pour motif personnel ou économique, et une procédure : convocation, entretien préalable, lettre de licenciement.</td></tr>
    <tr><td>Rupture conventionnelle</td><td>Les deux, d'un commun accord</td><td>Elle doit être validée (homologuée) par l'administration. Le salarié a droit aux allocations chômage.</td></tr></table></div>
    <div class="ex"><span class="lab">Exemple</span>Un employeur licencie une salariée « parce qu'elle ne s'entend pas avec lui », sans fait précis. Ce n'est pas une cause réelle et sérieuse : la salariée peut saisir le conseil de prud'hommes et obtenir une indemnité.</div>`},
  { titre:"Droit : le numérique et les données personnelles", freq:"Fréquent", html:`
    <ul><li><b>Contrat en ligne</b> : l'acheteur doit pouvoir vérifier sa commande et son prix total avant de la confirmer (article 1127-2 du Code civil, la règle du « double clic »).</li>
    <li><b>Droit de rétractation</b> : 14 jours pour le consommateur qui achète à distance (article L221-18 du Code de la consommation).</li>
    <li><b>Données personnelles</b> : le règlement général sur la protection des données impose une raison légale pour les collecter (par exemple le consentement), une information claire, et donne aux personnes un droit d'accès, de rectification et d'effacement.</li>
    <li><b>Marque et nom de domaine</b> : une marque enregistrée à l'Institut national de la propriété industrielle est protégée 10 ans, renouvelables. Un nom de domaine qui imite une marque connue pour attirer ses clients peut être sanctionné (contrefaçon ou concurrence déloyale).</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Un site crée l'adresse « jouetsdiscount-promo.com » avec les couleurs et le logo d'un grand site de jouets. Le titulaire de la marque peut agir en justice pour faire fermer le site et obtenir des dommages et intérêts.</div>`}
  ],
  quiz:[
  {q:"« Le taux de chômage baisse en France au troisième trimestre. » C'est un sujet de…",o:["Économie","Management"],a:0,e:"On parle d'un pays entier, pas d'une organisation précise : c'est de l'économie."},
  {q:"« La gérante d'une boutique décide de réorganiser les horaires de ses vendeuses. » C'est un sujet de…",o:["Économie","Management"],a:1,e:"Une décision prise à l'intérieur d'une organisation : c'est du management."},
  {q:"Une boulangerie vend 20 000 euros et achète 6 000 euros de matières premières et d'énergie. Sa valeur ajoutée est de :",o:["26 000 euros","14 000 euros","20 000 euros"],a:1,e:"Valeur ajoutée = ventes − consommations intermédiaires = 20 000 − 6 000 = 14 000 euros."},
  {q:"Quelle est la finalité d'une association comme un centre social ?",o:["Lucrative","Non lucrative","Commerciale"],a:1,e:"Une association ne cherche pas à partager des bénéfices entre ses membres : sa finalité est non lucrative."},
  {q:"Dans « PO3C » de Fayol, que signifie le P ?",o:["Produire","Prévoir","Payer"],a:1,e:"Prévoir, Organiser, Commander, Coordonner, Contrôler."},
  {q:"Un nouveau concurrent s'installe à côté de l'entreprise. Dans une matrice SWOT, c'est…",o:["Une faiblesse","Une menace","Une force"],a:1,e:"Cela vient de l'extérieur et c'est négatif : c'est une menace."},
  {q:"Le manager demande l'avis de ses salariés puis décide seul. Style de direction selon Likert :",o:["Participatif","Consultatif","Autoritaire paternaliste"],a:1,e:"Il consulte mais garde la décision finale : style consultatif."},
  {q:"Quel auteur parle de « rationalité limitée » ?",o:["Adam Smith","Herbert Simon","Michael Porter"],a:1,e:"Herbert Simon : le décideur choisit la première solution satisfaisante, faute d'informations complètes."},
  {q:"Décider d'ouvrir une filiale à l'étranger est une décision…",o:["Opérationnelle","Tactique","Stratégique"],a:2,e:"Elle engage l'avenir de l'entreprise sur le long terme : décision stratégique (classement d'Ansoff)."},
  {q:"Les trottinettes électriques face aux taxis, dans les cinq forces de Porter, ce sont…",o:["Des produits de substitution","Des fournisseurs","Des clients"],a:0,e:"Elles répondent au même besoin (se déplacer) d'une autre façon : produit de substitution."},
  {q:"Dans un syllogisme juridique, la « majeure » c'est…",o:["Les faits","La règle de droit","La conclusion"],a:1,e:"La majeure est la règle de droit, avec sa source (article)."},
  {q:"Un acheteur a été trompé par un mensonge du vendeur. C'est…",o:["Une erreur","Un dol","Une violence"],a:1,e:"Le dol : l'autre partie a menti ou manœuvré pour obtenir le consentement."},
  {q:"Dans une société à responsabilité limitée, les associés sont responsables des dettes…",o:["Sur tous leurs biens","Dans la limite de leurs apports","Jamais"],a:1,e:"La responsabilité est limitée au montant de leurs apports."},
  {q:"Délai de rétractation pour un achat en ligne :",o:["7 jours","14 jours","30 jours"],a:1,e:"14 jours, article L221-18 du Code de la consommation."},
  {q:"Le fournisseur ne livre pas : le client refuse de payer tant qu'il n'est pas livré. C'est…",o:["L'exception d'inexécution","La force majeure","La résolution"],a:0,e:"Il suspend sa propre obligation tant que l'autre n'exécute pas la sienne."},
  {q:"Les trois conditions de la responsabilité civile :",o:["Faute, contrat, juge","Fait générateur, dommage, lien de causalité","Dommage, assurance, plainte"],a:1,e:"Il faut un fait générateur, un dommage et un lien de causalité entre les deux."},
  {q:"Un licenciement doit reposer sur…",o:["Une cause réelle et sérieuse","L'accord du salarié","Une décision du juge"],a:0,e:"Article L1232-1 du Code du travail."},
  {q:"La rupture conventionnelle est…",o:["Décidée par l'employeur seul","Un accord entre l'employeur et le salarié","Une démission"],a:1,e:"Elle est conclue d'un commun accord et homologuée par l'administration."}

  cas:[
  {titre:"La Petite Fabrique, atelier de bougies", enonce:`<p>Léa a créé La Petite Fabrique, une entreprise individuelle qui fabrique des bougies artisanales à Lyon. Elle emploie deux salariées. Ses bougies sont très appréciées pour leurs parfums originaux, mais son atelier est trop petit pour produire plus. Depuis un an, la mode du « fait main » et des produits locaux progresse fortement. En revanche, le prix de la cire a augmenté de 30 % et une grande enseigne vient de lancer des bougies parfumées à petit prix.</p><p>Léa hésite : louer un local plus grand ou rester petite. Elle réunit ses deux salariées, écoute leurs avis, puis décide seule.</p>`,
   qs:[
    {q:"1. Quelle est la finalité de La Petite Fabrique ? Justifiez.",r:"Finalité <b>lucrative</b> : c'est une entreprise privée qui vend ses bougies pour réaliser des bénéfices."},
    {q:"2. Réalisez le diagnostic SWOT de l'entreprise.",r:"<b>Forces</b> (interne, positif) : parfums originaux, bougies appréciées.<br><b>Faiblesses</b> (interne, négatif) : atelier trop petit, production limitée.<br><b>Opportunités</b> (externe, positif) : mode du fait main et des produits locaux.<br><b>Menaces</b> (externe, négatif) : hausse de 30 % du prix de la cire, nouveau concurrent à petit prix."},
    {q:"3. La décision de louer un local plus grand est-elle stratégique, tactique ou opérationnelle ?",r:"<b>Stratégique</b> : elle engage l'avenir de l'entreprise sur le long terme, elle est prise par la dirigeante et elle est difficile à annuler."},
    {q:"4. Identifiez le style de direction de Léa.",r:"Style <b>consultatif</b> (Likert) : elle demande l'avis de ses salariées mais prend la décision finale seule."},
    {q:"5. La hausse du prix de la cire : économie ou management ?",r:"<b>Économie</b> : c'est un phénomène de marché (prix d'une matière première), extérieur à l'entreprise. La réaction de Léa face à cette hausse, elle, relèverait du management."}
   ]},
  {titre:"Droit : Meubles Ébène, société à responsabilité limitée", enonce:`<p>La société à responsabilité limitée Meubles Ébène, créée par trois associés avec 10 000 euros d'apport chacun, vend des meubles sur son site internet.</p>
   <p>Mme Roux a commandé une table en ligne le 15 janvier. Elle l'a reçue le 20 janvier. Le 28 janvier, elle écrit à la société pour annoncer qu'elle renvoie la table, qui ne lui plaît finalement pas. Le gérant refuse : « Nos meubles ne sont ni repris ni échangés. »</p>
   <p>Par ailleurs, la société a de grosses difficultés. Un fournisseur impayé menace de saisir la maison de l'un des associés.</p>`,
   qs:[
    {q:"1. Formulez le problème juridique posé par la demande de Mme Roux.",r:"Un consommateur qui a acheté un bien à distance peut-il revenir sur son achat sans donner de motif, et le vendeur peut-il l'en empêcher ?"},
    {q:"2. Résolvez ce problème avec un syllogisme juridique.",r:"<b>Majeure</b> : selon l'article L221-18 du Code de la consommation, le consommateur qui conclut un contrat à distance dispose de 14 jours pour exercer son droit de rétractation, sans avoir à se justifier ni à payer de pénalité. Pour un bien, le délai court à compter de sa réception. Le vendeur ne peut pas supprimer ce droit par une clause.<br><b>Mineure</b> : Mme Roux est une consommatrice qui a acheté une table sur internet, donc à distance. Elle l'a reçue le 20 janvier et a exercé son droit le 28 janvier, soit 8 jours après.<br><b>Conclusion</b> : Mme Roux est dans le délai. La phrase « ni repris ni échangés » ne s'applique pas à elle : la société doit accepter le retour et la rembourser."},
    {q:"3. Le fournisseur peut-il saisir la maison de l'associé ? Justifiez.",r:"<b>Non.</b> Dans une société à responsabilité limitée, les associés ne sont responsables des dettes de la société que dans la limite de leurs apports (ici 10 000 euros chacun). La société est une personne morale avec son propre patrimoine : le fournisseur doit se faire payer sur les biens de la société, pas sur ceux des associés."}
   ]}
  ]
},
{ id:"p1", code:"P1", group:"Processus comptables", name:"Contrôle et traitement comptable des opérations commerciales", short:"Factures, avoirs, taxe sur la valeur ajoutée",
  fiches:[
  { titre:"La logique du débit et du crédit", freq:"Base de tout", html:`
    <p>Chaque opération s'enregistre dans le <b>journal</b> avec au moins deux comptes : un au <b>débit</b> (colonne de gauche) et un au <b>crédit</b> (colonne de droite). Le total des débits est toujours égal au total des crédits.</p>
    <ul><li>On met au <b>débit</b> ce qui <b>entre</b> ou ce qu'on <b>consomme</b> : une charge, un achat, une créance sur un client.</li>
    <li>On met au <b>crédit</b> ce qui <b>sort</b> ou ce qu'on <b>gagne</b> : une vente, une dette envers un fournisseur.</li></ul>
    <div class="tip"><span class="lab">Astuce</span>Classe 6 = charges (toujours au débit quand elles augmentent). Classe 7 = produits (toujours au crédit quand ils augmentent). 401 = fournisseurs (on leur doit de l'argent : crédit). 411 = clients (ils nous doivent de l'argent : débit).</div>`},
  { titre:"La taxe sur la valeur ajoutée (TVA)", freq:"Présent dans presque tous les sujets", html:`
    <p>La <b>taxe sur la valeur ajoutée</b> est un impôt payé au final par le consommateur. L'entreprise ne fait que la <b>collecter</b> pour l'État.</p>
    <ul><li>Quand l'entreprise <b>vend</b>, elle facture la taxe au client : c'est la <b>taxe collectée</b> (compte 44571), une dette envers l'État → au <b>crédit</b>.</li>
    <li>Quand l'entreprise <b>achète</b>, elle paie la taxe à son fournisseur : c'est la <b>taxe déductible</b> (compte 44566 pour les biens et services), une créance sur l'État → au <b>débit</b>.</li>
    <li>Chaque mois : taxe à payer à l'État = taxe collectée − taxe déductible.</li></ul>
    <p>Taux en France : 20 % (taux normal), 10 % (restauration, travaux), 5,5 % (alimentation, livres), 2,1 % (médicaments remboursés, presse).</p>
    <div class="ex"><span class="lab">Exemple</span>Prix hors taxes 500 euros, taux 20 % → taxe = 500 × 0,20 = 100 euros → toutes taxes comprises = 600 euros.<br>Pour retrouver le hors taxes à partir du toutes taxes comprises : 600 ÷ 1,20 = 500.</div>`},
  { titre:"Les réductions : remise, rabais, ristourne et escompte", freq:"Très fréquent", html:`
    <div class="tbl"><table><tr><th>Réduction</th><th>Pourquoi on l'accorde</th><th>Type</th></tr>
    <tr><td>Rabais</td><td>Défaut de qualité ou retard de livraison</td><td>Commerciale</td></tr>
    <tr><td>Remise</td><td>Grosse quantité achetée, client fidèle</td><td>Commerciale</td></tr>
    <tr><td>Ristourne</td><td>Calculée sur le total des achats d'une période (par exemple l'année)</td><td>Commerciale</td></tr>
    <tr><td>Escompte</td><td>Le client paie plus tôt que prévu</td><td><b>Financière</b></td></tr></table></div>
    <div class="tip"><span class="lab">À retenir</span>Les réductions <b>commerciales</b> présentes sur la facture <b>ne s'enregistrent pas</b> : on comptabilise directement le montant net. L'<b>escompte</b>, lui, s'enregistre : compte 665 « Escomptes accordés » (charge) chez le vendeur, compte 765 « Escomptes obtenus » (produit) chez l'acheteur.</div>
    <p><b>Ordre de calcul</b> sur une facture : prix brut → remises commerciales → <b>net commercial</b> → escompte → <b>net financier</b> → taxe calculée sur le net financier → total toutes taxes comprises.</p>`},
  { titre:"Enregistrer une facture de vente", freq:"Très fréquent", html:`
    <div class="ex"><span class="lab">Exemple</span>Le 10 mars, la société Lumia vend des lampes au client Durand : prix brut 1 000 euros, remise 10 %, escompte 2 %, taxe 20 %.<br>
    Remise : 1 000 × 10 % = 100 → net commercial = 900<br>
    Escompte : 900 × 2 % = 18 → net financier = 882<br>
    Taxe : 882 × 20 % = 176,40 → toutes taxes comprises = 1 058,40</div>
    <div class="tbl"><table><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
    <tr><td>411</td><td>Clients (Durand)</td><td class="num">1 058,40</td><td></td></tr>
    <tr><td>665</td><td>Escomptes accordés</td><td class="num">18,00</td><td></td></tr>
    <tr><td>707</td><td>Ventes de marchandises</td><td></td><td class="num">900,00</td></tr>
    <tr><td>44571</td><td>Taxe sur la valeur ajoutée collectée</td><td></td><td class="num">176,40</td></tr>
    <tr><th colspan="2">Totaux</th><td class="num">1 076,40</td><td class="num">1 076,40</td></tr></table></div>
    <div class="trap"><span class="lab">Piège</span>Le compte 707 reçoit le <b>net commercial</b> (900), pas le net financier : l'escompte est enregistré à part, dans le 665.</div>`},
  { titre:"Enregistrer une facture d'achat", freq:"Très fréquent", html:`
    <div class="ex"><span class="lab">Exemple</span>Le client Durand enregistre la même facture chez lui, côté achat.</div>
    <div class="tbl"><table><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
    <tr><td>607</td><td>Achats de marchandises</td><td class="num">900,00</td><td></td></tr>
    <tr><td>44566</td><td>Taxe sur la valeur ajoutée déductible</td><td class="num">176,40</td><td></td></tr>
    <tr><td>401</td><td>Fournisseurs (Lumia)</td><td></td><td class="num">1 058,40</td></tr>
    <tr><td>765</td><td>Escomptes obtenus</td><td></td><td class="num">18,00</td></tr>
    <tr><th colspan="2">Totaux</th><td class="num">1 076,40</td><td class="num">1 076,40</td></tr></table></div>
    <p><b>Frais de port</b> : chez l'acheteur, compte 6241 « Transports sur achats » ; chez le vendeur qui les refacture, compte 7085 « Ports et frais accessoires facturés ». Ils sont soumis à la taxe.</p>`},
  { titre:"La facture d'avoir", freq:"Très fréquent", html:`
    <div class="def">Une <b>facture d'avoir</b> est une facture « à l'envers » : elle annule tout ou partie d'une facture déjà envoyée (retour de marchandises, rabais accordé après coup, erreur).</div>
    <p>On inverse donc le sens habituel. Si la réduction est accordée <b>après</b> la facture, on utilise les comptes de réductions : 709 chez le vendeur, 609 chez l'acheteur.</p>
    <div class="ex"><span class="lab">Exemple</span>Lumia accorde à Durand un rabais de 50 euros hors taxes pour une lampe rayée. Taxe : 10 euros. Total : 60 euros.</div>
    <div class="tbl"><table><tr><th colspan="4">Chez le vendeur (Lumia)</th></tr><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
    <tr><td>709</td><td>Rabais, remises et ristournes accordés</td><td class="num">50,00</td><td></td></tr>
    <tr><td>44571</td><td>Taxe collectée</td><td class="num">10,00</td><td></td></tr>
    <tr><td>411</td><td>Clients (Durand)</td><td></td><td class="num">60,00</td></tr></table></div>
    <div class="tbl"><table><tr><th colspan="4">Chez l'acheteur (Durand)</th></tr><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
    <tr><td>401</td><td>Fournisseurs (Lumia)</td><td class="num">60,00</td><td></td></tr>
    <tr><td>609</td><td>Rabais, remises et ristournes obtenus</td><td></td><td class="num">50,00</td></tr>
    <tr><td>44566</td><td>Taxe déductible</td><td></td><td class="num">10,00</td></tr></table></div>
    <div class="tip"><span class="lab">Astuce</span>Pour un <b>retour de marchandises</b>, on annule directement dans le compte d'origine (707 chez le vendeur, 607 chez l'acheteur) au lieu de 709 et 609.</div>`}
  ],
  quiz:[
  {q:"Chez le vendeur, la taxe sur la valeur ajoutée facturée au client va dans le compte…",o:["44566 au débit","44571 au crédit","401 au crédit"],a:1,e:"C'est de la taxe collectée, une dette envers l'État : 44571 au crédit."},
  {q:"Prix toutes taxes comprises 240 euros, taux 20 %. Le prix hors taxes est de :",o:["192 euros","200 euros","220 euros"],a:1,e:"240 ÷ 1,20 = 200. Attention : on ne retire pas 20 % de 240 (ce qui donnerait 192)."},
  {q:"Une remise de 5 % figure sur la facture. On l'enregistre…",o:["Au compte 709","Au compte 665","On ne l'enregistre pas"],a:2,e:"Les réductions commerciales sur facture ne sont pas comptabilisées : on enregistre le net commercial."},
  {q:"Chez l'acheteur, un escompte obtenu s'enregistre au compte :",o:["665 au débit","765 au crédit","609 au crédit"],a:1,e:"C'est un produit financier pour l'acheteur : 765 Escomptes obtenus, au crédit."},
  {q:"La taxe est calculée sur…",o:["Le prix brut","Le net commercial","Le net financier"],a:2,e:"Toujours sur le dernier montant hors taxes, après remises et escompte : le net financier."},
  {q:"Le client retourne des marchandises défectueuses. Chez le vendeur, on débite :",o:["Le compte 707","Le compte 411","Le compte 607"],a:0,e:"Pour un retour, on annule la vente directement dans le 707 (au débit), et on crédite le 411."},
  {q:"Les frais de port payés par l'acheteur vont au compte :",o:["7085","6241","607"],a:1,e:"6241 Transports sur achats. Le 7085 est utilisé par le vendeur qui refacture les frais."},
  {q:"Prix brut 2 000 euros, remise 10 %, escompte 1 %. Le net financier est de :",o:["1 782 euros","1 780 euros","1 800 euros"],a:0,e:"2 000 − 200 = 1 800 ; 1 800 × 1 % = 18 ; 1 800 − 18 = 1 782."}
  ],
  cas:[
  {titre:"Société Vertéo, matériel de jardin", enonce:`<p>La société Vertéo vend du matériel de jardin. Le 15 avril, elle envoie la facture n° 248 à son client Jardiland Nord : 20 tondeuses à 150 euros hors taxes l'unité, remise de 5 %, escompte de 2 % pour paiement sous 8 jours, frais de port refacturés 60 euros hors taxes (sans remise ni escompte). Taxe sur la valeur ajoutée : 20 %.</p><p>Le 20 avril, Jardiland Nord retourne 2 tondeuses abîmées. Vertéo envoie une facture d'avoir.</p>`,
   qs:[

    {q:"3. Calculez l'avoir pour les 2 tondeuses retournées (mêmes conditions de remise et d'escompte).",r:"Brut : 2 × 150 = 300 → remise 15 → 285 → escompte 5,70 → net financier 279,30<br>Taxe : 55,86<br><b>Total de l'avoir : 335,16 euros</b>"},
    {q:"4. Enregistrez l'avoir chez Vertéo.",r:`<div class="tbl"><table><tr><th>Compte</th><th>Débit</th><th>Crédit</th></tr><tr><td>707 Ventes de marchandises</td><td class="num">285,00</td><td></td></tr><tr><td>44571 Taxe collectée</td><td class="num">55,86</td><td></td></tr><tr><td>665 Escomptes accordés</td><td></td><td class="num">5,70</td></tr><tr><td>411 Clients</td><td></td><td class="num">335,16</td></tr><tr><th>Totaux</th><td class="num">340,86</td><td class="num">340,86</td></tr></table></div>On inverse l'écriture d'origine : c'est un retour, donc on débite directement le 707.`}

{ id:"p6", code:"P6", group:"Processus comptables", name:"Analyse de la situation financière", short:"Soldes intermédiaires de gestion",
  fiches:[
  { titre:"Les soldes intermédiaires de gestion : à quoi ça sert", freq:"Tombe très souvent", html:`
    <p>Le compte de résultat donne un seul chiffre final : le bénéfice ou la perte. Les <b>soldes intermédiaires de gestion</b> découpent ce résultat en étapes pour comprendre <b>d'où vient</b> le bénéfice (ou la perte).</p>
    <div class="ex"><span class="lab">Image pour comprendre</span>C'est comme ta fiche de paie : le salaire brut, puis les cotisations retirées, puis le net, puis le net après impôt. Chaque étape t'explique où part l'argent.</div>
    <p>Les principaux soldes, dans l'ordre :</p>
    <ul><li><b>Marge commerciale</b> (pour les entreprises qui revendent)</li><li><b>Production de l'exercice</b> (pour les entreprises qui fabriquent)</li><li><b>Valeur ajoutée</b></li><li><b>Excédent brut d'exploitation</b></li><li><b>Résultat d'exploitation</b></li><li>Résultat courant avant impôts, résultat exceptionnel, résultat de l'exercice</li></ul>`},
  { titre:"Marge commerciale et valeur ajoutée", freq:"Très fréquent", html:`
    <div class="def"><b>Marge commerciale</b> = ventes de marchandises − coût d'achat des marchandises vendues.<br>Coût d'achat des marchandises vendues = achats de marchandises ± variation de stock de marchandises.</div>
    <div class="ex"><span class="lab">Exemple</span>Un magasin vend 80 000 euros de vêtements. Il a acheté 50 000 euros de vêtements, et son stock a <b>diminué</b> de 2 000 euros (il a vendu un peu de son ancien stock).<br>Coût d'achat des marchandises vendues = 50 000 + 2 000 = 52 000<br>Marge commerciale = 80 000 − 52 000 = <b>28 000 euros</b></div>
    <div class="trap"><span class="lab">Piège</span>Dans le compte 6037 « Variation des stocks de marchandises », une diminution du stock apparaît en positif (elle s'ajoute aux achats) et une augmentation en négatif.</div>
    <div class="def"><b>Valeur ajoutée</b> = marge commerciale + production de l'exercice − consommations en provenance des tiers (matières premières, autres achats et charges externes : loyer, électricité, assurance, honoraires…).</div>`},
  { titre:"Excédent brut d'exploitation et résultat d'exploitation", freq:"Très fréquent", html:`
    <div class="def"><b>Excédent brut d'exploitation</b> = valeur ajoutée + subventions d'exploitation − impôts et taxes − charges de personnel (salaires et cotisations sociales).</div>
    <p>Il mesure ce que l'activité normale rapporte, <b>avant</b> les amortissements, les intérêts et les impôts sur les bénéfices. C'est l'indicateur préféré des banquiers.</p>
    <div class="ex"><span class="lab">Exemple</span>Valeur ajoutée 120 000 ; impôts et taxes 5 000 ; salaires 60 000 ; cotisations sociales 25 000.<br>Excédent brut d'exploitation = 120 000 − 5 000 − 60 000 − 25 000 = <b>30 000 euros</b></div>
    <div class="def"><b>Résultat d'exploitation</b> = excédent brut d'exploitation + reprises et transferts de charges + autres produits − dotations aux amortissements et provisions − autres charges.</div>
    <div class="tip"><span class="lab">Astuce pour l'examen</span>Toujours présenter dans un tableau à deux colonnes (produits / charges) et faire une phrase de commentaire après chaque solde : « La valeur ajoutée représente x % du chiffre d'affaires, ce qui signifie… ».</div>`},
  { titre:"Le bilan fonctionnel : fonds de roulement, besoin en fonds de roulement, trésorerie", freq:"Tombe très souvent", html:`
    <p>Le bilan fonctionnel classe le bilan selon les <b>fonctions</b> : ce qui dure (investissement et financement durable) et ce qui tourne tous les jours (exploitation).</p>
    <div class="def"><b>Fonds de roulement net global</b> = ressources stables − emplois stables.<br>Ressources stables = capitaux propres + amortissements et dépréciations + dettes financières (emprunts).<br>Emplois stables = immobilisations à leur valeur brute.</div>
    <div class="def"><b>Besoin en fonds de roulement d'exploitation</b> = (stocks + créances clients) − (dettes fournisseurs + dettes fiscales et sociales).<br>C'est l'argent « bloqué » par le cycle quotidien : on paie les fournisseurs avant d'être payé par les clients.</div>
    <div class="def"><b>Trésorerie nette</b> = fonds de roulement − besoin en fonds de roulement = disponibilités − concours bancaires (découverts).</div>
    <div class="ex"><span class="lab">Exemple</span>Ressources stables 500 000, emplois stables 420 000 → fonds de roulement = <b>80 000</b>.<br>Stocks 40 000 + clients 50 000 − fournisseurs 25 000 − dettes fiscales et sociales 5 000 → besoin en fonds de roulement = <b>60 000</b>.<br>Trésorerie nette = 80 000 − 60 000 = <b>20 000</b> : l'équilibre est bon, le fonds de roulement finance tout le besoin.</div>
    <div class="trap"><span class="lab">Piège</span>Dans le bilan fonctionnel, les immobilisations sont à leur valeur <b>brute</b>, et les amortissements passent dans les ressources stables.</div>`},
  { titre:"La capacité d'autofinancement", freq:"Fréquent", html:`
    <div class="def">La <b>capacité d'autofinancement</b> est l'argent que l'activité de l'année permet de dégager, et que l'entreprise peut utiliser pour investir, rembourser ses emprunts ou verser des dividendes.</div>
    <p><b>Méthode additive</b> (à partir du résultat) : on retire du résultat ce qui n'est pas de l'argent réel.</p>
    <div class="def">Capacité d'autofinancement = résultat de l'exercice + dotations aux amortissements, dépréciations et provisions − reprises + valeur nette comptable des éléments d'actif cédés − produits des cessions d'éléments d'actif − quotes-parts de subventions d'investissement virées au résultat</div>
    <div class="ex"><span class="lab">Exemple</span>Résultat 30 000 ; dotations 12 000 ; reprises 2 000 ; une machine vendue 8 000 euros, dont la valeur nette comptable était de 5 000.<br>30 000 + 12 000 − 2 000 + 5 000 − 8 000 = <b>37 000 euros</b></div>
    <div class="tip"><span class="lab">Pourquoi ces corrections ?</span>Une dotation diminue le résultat sans sortie d'argent : on la rajoute. La vente d'une machine est une opération exceptionnelle, pas de l'activité courante : on l'enlève.</div>`}
  ],
  quiz:[
  {q:"Ventes de marchandises 50 000, coût d'achat des marchandises vendues 32 000. Marge commerciale :",o:["82 000","18 000","32 000"],a:1,e:"50 000 − 32 000 = 18 000 euros."},
  {q:"Le stock de marchandises a augmenté de 1 000 euros. Achats : 40 000. Coût d'achat des marchandises vendues :",o:["41 000","39 000","40 000"],a:1,e:"Une partie des achats est restée en stock : 40 000 − 1 000 = 39 000."},
  {q:"Les salaires interviennent dans le calcul de…",o:["La valeur ajoutée","L'excédent brut d'exploitation","La marge commerciale"],a:1,e:"Les charges de personnel sont retirées de la valeur ajoutée pour obtenir l'excédent brut d'exploitation."},
  {q:"Les dotations aux amortissements sont retirées pour passer…",o:["De l'excédent brut d'exploitation au résultat d'exploitation","De la marge commerciale à la valeur ajoutée","De la valeur ajoutée à l'excédent brut d'exploitation"],a:0,e:"Résultat d'exploitation = excédent brut d'exploitation − dotations + reprises + autres produits − autres charges."},
  {q:"Le loyer du magasin intervient dans le calcul de…",o:["La marge commerciale","La valeur ajoutée","Le résultat exceptionnel"],a:1,e:"Le loyer fait partie des « autres achats et charges externes » : il est retiré pour calculer la valeur ajoutée."},
  {q:"Pourquoi les banquiers regardent-ils surtout l'excédent brut d'exploitation ?",o:["Parce qu'il inclut les impôts","Parce qu'il montre ce que rapporte l'activité normale, avant amortissements et frais financiers","Parce qu'il est toujours positif"],a:1,e:"Il mesure la capacité de l'activité elle-même à dégager de l'argent, indépendamment de la façon dont l'entreprise est financée."},
  {q:"Ressources stables 300 000, emplois stables 250 000. Fonds de roulement :",o:["50 000","550 000","−50 000"],a:0,e:"300 000 − 250 000 = 50 000."},
  {q:"Fonds de roulement 50 000, besoin en fonds de roulement 70 000. Trésorerie nette :",o:["+20 000","−20 000","120 000"],a:1,e:"50 000 − 70 000 = −20 000 : l'entreprise est à découvert."},
  {q:"Dans le calcul de la capacité d'autofinancement, les dotations aux amortissements sont…",o:["Ajoutées au résultat","Retirées du résultat","Ignorées"],a:0,e:"Elles ont diminué le résultat sans sortie d'argent : on les rajoute."}
  ],
  cas:[
  {titre:"Boutique Indigo, prêt-à-porter", enonce:`<p>Voici les éléments du compte de résultat de la boutique Indigo pour l'année N (en euros) :</p>
   <div class="tbl"><table><tr><th>Élément</th><th>Montant</th></tr>
   <tr><td>Ventes de marchandises</td><td class="num">150 000</td></tr><tr><td>Achats de marchandises</td><td class="num">90 000</td></tr>
   <tr><td>Variation de stock de marchandises (le stock a diminué)</td><td class="num">3 000</td></tr><tr><td>Autres achats et charges externes (loyer, électricité, publicité)</td><td class="num">18 000</td></tr>
   <tr><td>Impôts et taxes</td><td class="num">2 000</td></tr><tr><td>Salaires</td><td class="num">25 000</td></tr>
   <tr><td>Cotisations sociales</td><td class="num">10 000</td></tr><tr><td>Dotations aux amortissements</td><td class="num">4 000</td></tr></table></div>`,
   qs:[
    {q:"1. Calculez la marge commerciale.",r:"Coût d'achat des marchandises vendues = 90 000 + 3 000 = 93 000 (le stock a diminué, donc on a vendu plus que ce qu'on a acheté).<br><b>Marge commerciale = 150 000 − 93 000 = 57 000 euros</b>"},
    {q:"2. Calculez la valeur ajoutée.",r:"<b>Valeur ajoutée = 57 000 − 18 000 = 39 000 euros</b>, soit 26 % des ventes (39 000 ÷ 150 000)."},
    {q:"3. Calculez l'excédent brut d'exploitation.",r:"<b>Excédent brut d'exploitation = 39 000 − 2 000 − 25 000 − 10 000 = 2 000 euros</b>"},
    {q:"4. Calculez le résultat d'exploitation et commentez.",r:"<b>Résultat d'exploitation = 2 000 − 4 000 = −2 000 euros</b> (perte).<br>Commentaire : la marge commerciale est correcte (38 % des ventes), mais les charges de personnel absorbent presque toute la valeur ajoutée. L'activité ne rapporte pas assez pour couvrir l'usure du matériel (amortissements). Pistes : augmenter les ventes, revoir l'organisation des horaires ou négocier le loyer."}
   ]},
  {titre:"Bilan fonctionnel : société Atlantis", enonce:`<p>Extrait du bilan fonctionnel de la société Atlantis au 31 décembre N (en euros) :</p>
   <div class="tbl"><table><tr><th>Élément</th><th>Montant</th></tr>
   <tr><td>Capitaux propres</td><td class="num">180 000</td></tr><tr><td>Amortissements et dépréciations</td><td class="num">60 000</td></tr>
   <tr><td>Emprunts</td><td class="num">90 000</td></tr><tr><td>Immobilisations brutes</td><td class="num">300 000</td></tr>
   <tr><td>Stocks</td><td class="num">45 000</td></tr><tr><td>Créances clients</td><td class="num">70 000</td></tr>
   <tr><td>Dettes fournisseurs</td><td class="num">40 000</td></tr><tr><td>Dettes fiscales et sociales</td><td class="num">15 000</td></tr></table></div>`,
   qs:[
    {q:"1. Calculez le fonds de roulement net global.",r:"Ressources stables = 180 000 + 60 000 + 90 000 = 330 000<br>Emplois stables = 300 000<br><b>Fonds de roulement = 30 000 euros</b>"},
    {q:"2. Calculez le besoin en fonds de roulement d'exploitation.",r:"(45 000 + 70 000) − (40 000 + 15 000) = 115 000 − 55 000 = <b>60 000 euros</b>"},
    {q:"3. Calculez la trésorerie nette et commentez.",r:"30 000 − 60 000 = <b>−30 000 euros</b>.<br>Le fonds de roulement ne couvre que la moitié du besoin : l'entreprise vit à découvert, ce qui coûte des intérêts. Pistes : réduire les délais de paiement des clients, réduire les stocks, négocier des délais plus longs avec les fournisseurs, ou augmenter les ressources stables (apport des associés, emprunt à long terme)."}
   ]}
  ]
},
{ id:"p2", code:"P2", group:"Processus comptables", name:"Contrôle et production de l'information financière", short:"Travaux d'inventaire, comptes annuels",
  fiches:[
  { titre:"Les travaux d'inventaire : pourquoi on les fait", freq:"Base du processus 2", html:`
    <p>À la fin de l'année (la <b>clôture de l'exercice</b>, souvent le 31 décembre), le comptable fait des écritures de correction pour que les comptes donnent une <b>image fidèle</b> de l'entreprise. Ce sont les <b>travaux d'inventaire</b>.</p>
    <p>Deux grands principes les justifient :</p>
    <ul><li><b>L'indépendance des exercices</b> : chaque année ne supporte que les charges et produits qui la concernent.</li>
    <li><b>La prudence</b> : on enregistre les pertes probables, même si elles ne sont pas encore certaines, mais jamais les gains seulement probables.</li></ul>
    <p>Les principaux travaux : les <b>amortissements</b>, les <b>dépréciations</b> (créances clients, stocks), les <b>charges et produits constatés d'avance</b>, les <b>charges à payer et produits à recevoir</b>, la <b>variation des stocks</b>.</p>
    <div class="ex"><span class="lab">Exemple</span>Tu paies ton assurance auto le 1er octobre pour un an. Au 31 décembre, seuls 3 mois concernent cette année : les 9 autres mois concernent l'année suivante. Le comptable va « sortir » ces 9 mois des charges de l'année.</div>`},
  { titre:"L'amortissement linéaire", freq:"Tombe à presque tous les examens", html:`
    <div class="def">Une <b>immobilisation</b> (machine, ordinateur, véhicule) s'use pendant plusieurs années. L'<b>amortissement</b> répartit son coût sur sa durée d'utilisation. Chaque année, on enregistre une charge : la <b>dotation aux amortissements</b>.</div>
    <ul><li><b>Base amortissable</b> = prix d'achat hors taxes + frais pour la mettre en service (livraison, installation).</li>
    <li><b>Taux linéaire</b> = 100 ÷ durée d'utilisation (5 ans → 20 %).</li>
    <li><b>Annuité</b> = base × taux.</li>
    <li>La première année, on calcule <b>au prorata du temps</b> (en mois ou en jours), à partir de la date de mise en service.</li>
    <li><b>Valeur nette comptable</b> = valeur d'origine − total des amortissements déjà pratiqués.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Machine achetée 12 000 euros hors taxes le 1er avril N, durée 5 ans. Clôture le 31 décembre.<br>Annuité pleine = 12 000 × 20 % = 2 400<br>Année N (9 mois, d'avril à décembre) = 2 400 × 9/12 = <b>1 800 euros</b><br>Valeur nette comptable fin N = 12 000 − 1 800 = 10 200</div>
    <div class="tbl"><table><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
    <tr><td>6811</td><td>Dotations aux amortissements</td><td class="num">1 800</td><td></td></tr>
    <tr><td>2815</td><td>Amortissements des installations techniques, matériel et outillage</td><td></td><td class="num">1 800</td></tr></table></div>
    <div class="trap"><span class="lab">Piège</span>La dernière année, on ne prend que les mois restants (ici 3 mois en N+5) pour que le total amorti soit exactement égal à 12 000.</div>`},
  { titre:"La dépréciation des créances clients", freq:"Très fréquent", html:`
    <p>Quand un client risque de ne pas payer (difficultés, liquidation), sa créance devient <b>douteuse</b>. Par prudence, on enregistre la perte probable.</p>
    <p>Deux étapes :</p>
    <ul><li><b>Reclasser</b> la créance du compte 411 « Clients » au compte 416 « Clients douteux », pour le montant toutes taxes comprises.</li>
    <li><b>Déprécier</b> le montant <b>hors taxes</b> multiplié par le pourcentage de perte probable. On calcule sur le hors taxes car la taxe sera récupérée auprès de l'État si le client ne paie jamais.</li></ul>
    <div class="ex"><span class="lab">Exemple</span>Le client Martin doit 1 200 euros toutes taxes comprises (taxe 20 %). On estime la perte probable à 40 %.<br>Hors taxes = 1 200 ÷ 1,20 = 1 000 → dépréciation = 1 000 × 40 % = <b>400 euros</b></div>
    <div class="tbl"><table><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
    <tr><td>416</td><td>Clients douteux</td><td class="num">1 200</td><td></td></tr>
    <tr><td>411</td><td>Clients (Martin)</td><td></td><td class="num">1 200</td></tr>
    <tr><td>6817</td><td>Dotations aux dépréciations des actifs circulants</td><td class="num">400</td><td></td></tr>
    <tr><td>491</td><td>Dépréciations des comptes de clients</td><td></td><td class="num">400</td></tr></table></div>`},
  { titre:"Charges et produits constatés d'avance, charges à payer", freq:"Très fréquent", html:`
    <div class="def"><b>Charge constatée d'avance</b> : charge payée cette année mais qui concerne en partie l'année suivante. On la retire des charges de l'année avec le compte 486.</div>
    <div class="ex"><span class="lab">Exemple</span>Assurance payée le 1er octobre N : 1 200 euros pour 12 mois. Les mois de janvier à septembre N+1 (9 mois) concernent N+1 : 1 200 × 9/12 = 900 euros.</div>
    <div class="tbl"><table><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
    <tr><td>486</td><td>Charges constatées d'avance</td><td class="num">900</td><td></td></tr>
    <tr><td>616</td><td>Primes d'assurance</td><td></td><td class="num">900</td></tr></table></div>
    <div class="def"><b>Produit constaté d'avance</b> (compte 487) : produit encaissé cette année qui concerne l'année suivante. Exemple : un client paie en décembre un abonnement de janvier.</div>
    <div class="def"><b>Charge à payer</b> : charge qui concerne cette année mais dont la facture n'est pas encore arrivée. Exemple : électricité de décembre facturée en janvier → compte 408 « Fournisseurs, factures non parvenues ».</div>
    <div class="tip"><span class="lab">Astuce</span>Au début de l'année suivante, on <b>annule</b> (on « contrepasse ») toutes ces écritures, pour que la charge retombe dans la bonne année.</div>`},
  { titre:"Le bilan et le compte de résultat", freq:"Base de tout", html:`
    <div class="def"><b>Le bilan</b> est une photo de l'entreprise à une date précise : ce qu'elle possède (<b>l'actif</b>) et comment elle l'a financé (<b>le passif</b>). Actif = passif, toujours.</div>
    <div class="tbl"><table><tr><th>Actif (ce qu'on possède)</th><th>Passif (d'où vient l'argent)</th></tr>
    <tr><td>Immobilisations (bâtiment, machines)<br>Stocks<br>Créances clients<br>Trésorerie (banque, caisse)</td><td>Capitaux propres (capital apporté, résultat de l'année)<br>Dettes (emprunts, fournisseurs, État, organismes sociaux)</td></tr></table></div>
    <div class="def"><b>Le compte de résultat</b> est un film de l'année : les <b>produits</b> (ce qu'on a gagné) moins les <b>charges</b> (ce qu'on a consommé) = le <b>résultat</b> (bénéfice ou perte).</div>
    <div class="ex"><span class="lab">Exemple</span>Le bénéfice de l'année apparaît deux fois : en bas du compte de résultat, et au passif du bilan dans les capitaux propres. C'est le lien entre les deux documents.</div>`}
  ],
  quiz:[
  {q:"Ordinateur acheté 3 000 euros hors taxes le 1er juillet N, amorti sur 3 ans. Dotation de l'année N :",o:["1 000 euros","500 euros","750 euros"],a:1,e:"Annuité pleine = 3 000 ÷ 3 = 1 000 ; 6 mois en N → 1 000 × 6/12 = 500."},
  {q:"Taux d'amortissement linéaire pour une durée de 4 ans :",o:["20 %","25 %","40 %"],a:1,e:"100 ÷ 4 = 25 %."},
  {q:"Une dépréciation de créance se calcule sur le montant…",o:["Toutes taxes comprises","Hors taxes","De la taxe seulement"],a:1,e:"La taxe sera récupérée auprès de l'État : la perte réelle porte sur le hors taxes."},
  {q:"Le loyer de janvier N+1 a été payé en décembre N. Au 31 décembre N, on enregistre…",o:["Une charge à payer","Une charge constatée d'avance","Un produit constaté d'avance"],a:1,e:"La charge est payée en N mais concerne N+1 : charge constatée d'avance (compte 486)."},
  {q:"La facture d'électricité de décembre arrivera en janvier. Au 31 décembre, on utilise le compte…",o:["408 Fournisseurs, factures non parvenues","486 Charges constatées d'avance","411 Clients"],a:0,e:"La charge concerne bien l'année N mais la facture n'est pas arrivée : charge à payer, compte 408."},
  {q:"Valeur d'origine 20 000, amortissements cumulés 12 000. Valeur nette comptable :",o:["32 000","8 000","12 000"],a:1,e:"20 000 − 12 000 = 8 000 euros."}
  ],
  cas:[
  {titre:"Imprimerie Duval, travaux de fin d'année", enonce:`<p>L'imprimerie Duval clôture son exercice le 31 décembre N. Le comptable doit passer les écritures d'inventaire suivantes :</p>
   <ul><li>Une presse achetée 30 000 euros hors taxes, mise en service le 1er juillet N, amortie en linéaire sur 5 ans.</li>
   <li>Le client Lebrun doit 2 400 euros toutes taxes comprises (taxe 20 %). Il est en difficulté : perte probable 50 %.</li>
   <li>Le loyer de l'atelier, 3 600 euros, a été payé le 1er novembre N pour novembre, décembre et janvier.</li></ul>`,
   qs:[
    {q:"1. Calculez la dotation aux amortissements de N et la valeur nette comptable au 31 décembre N.",r:"Annuité pleine = 30 000 × 20 % = 6 000<br>N (6 mois) = 6 000 × 6/12 = <b>3 000 euros</b><br>Valeur nette comptable = 30 000 − 3 000 = <b>27 000 euros</b>"},
    {q:"2. Enregistrez la dotation.",r:`<div class="tbl"><table><tr><th>Compte</th><th>Débit</th><th>Crédit</th></tr><tr><td>6811 Dotations aux amortissements</td><td class="num">3 000</td><td></td></tr><tr><td>2815 Amortissements du matériel</td><td></td><td class="num">3 000</td></tr></table></div>`},
    {q:"3. Traitez la créance du client Lebrun.",r:`Hors taxes = 2 400 ÷ 1,20 = 2 000 ; dépréciation = 2 000 × 50 % = <b>1 000 euros</b><div class="tbl"><table><tr><th>Compte</th><th>Débit</th><th>Crédit</th></tr><tr><td>416 Clients douteux</td><td class="num">2 400</td><td></td></tr><tr><td>411 Clients</td><td></td><td class="num">2 400</td></tr><tr><td>6817 Dotations aux dépréciations</td><td class="num">1 000</td><td></td></tr><tr><td>491 Dépréciations des comptes de clients</td><td></td><td class="num">1 000</td></tr></table></div>`},
    {q:"4. Traitez le loyer.",r:`Un mois sur trois (janvier) concerne N+1 : 3 600 ÷ 3 = <b>1 200 euros</b> de charge constatée d'avance.<div class="tbl"><table><tr><th>Compte</th><th>Débit</th><th>Crédit</th></tr><tr><td>486 Charges constatées d'avance</td><td class="num">1 200</td><td></td></tr><tr><td>613 Locations</td><td></td><td class="num">1 200</td></tr></table></div>`}
